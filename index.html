<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text2Test AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1e40af;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .upload-box {
            border: 2px dashed #93c5fd;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: #eff6ff;
            cursor: pointer;
        }

        .upload-box:hover {
            background: #dbeafe;
        }

        .upload-box strong {
            display: block;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .upload-box span {
            color: #64748b;
        }

        #fileInput {
            display: none;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .success-btn {
            background: #16a34a;
            color: white;
        }

        .success-btn:hover {
            background: #15803d;
        }

        .secondary-btn {
            background: #64748b;
            color: white;
        }

        .secondary-btn:hover {
            background: #475569;
        }

        .danger-btn {
            background: #dc2626;
            color: white;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status.success {
            background: #f0fdf4;
            color: #15803d;
        }

        .status.error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .question-card {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            background: #f8fbff;
        }

        .question-number {
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #f8fafc;
        }

        .option input {
            width: auto;
            margin-top: 3px;
        }

        .feedback {
            margin-top: 12px;
            padding: 10px;
            border-radius: 7px;
            display: none;
            font-weight: bold;
        }

        .feedback.correct {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .feedback.incorrect {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .score-box {
            display: none;
            text-align: center;
            padding: 25px;
            background: #eff6ff;
            border-radius: 12px;
            margin-top: 20px;
        }

        .score-box.show {
            display: block;
        }

        .score-number {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        .exam-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .exam-card {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 18px;
            background: #f8fbff;
        }

        .exam-card h3 {
            margin: 0 0 8px;
            color: #1e40af;
        }

        .exam-meta {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .public-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
            padding: 30px 15px;
            overflow-y: auto;
        }

        .modal.show {
            display: block;
        }

        .modal-content {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 14px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #1e40af;
        }

        .close-btn {
            background: #e2e8f0;
            color: #334155;
            padding: 8px 12px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .container {
                padding: 0 12px;
            }

            .card {
                padding: 18px;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Text2Test AI</h1>
    <p>Upload your textbook PDF to create an intelligent test.</p>
</header>


<div class="container">

    <!-- ===================================================== -->
    <!-- CREATE TEST -->
    <!-- ===================================================== -->

    <section class="card" id="createSection">

        <h2>Create a Test</h2>

        <div
            class="upload-box"
            id="uploadBox"
            onclick="document.getElementById('fileInput').click()"
        >
            <strong>Choose your PDF</strong>
            <span>Click here to select a textbook PDF</span>

            <input
                type="file"
                id="fileInput"
                accept=".pdf"
            >
        </div>

        <div
            id="fileName"
            style="margin-top:10px; font-weight:bold;"
        ></div>


        <div class="form-grid">

            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <select id="subject">
                    <option value="">
                        Select a subject
                    </option>
                </select>

            </div>


            <!-- GRADE -->

            <div class="form-group">

                <label for="grade">
                    Grade
                </label>

                <select id="grade">

                    <option value="">
                        Select a grade
                    </option>

                    <option value="Grade 6">
                        Grade 6
                    </option>

                    <option value="Grade 7">
                        Grade 7
                    </option>

                    <option value="Grade 8">
                        Grade 8
                    </option>

                    <option value="Grade 9">
                        Grade 9
                    </option>

                    <option value="Grade 10">
                        Grade 10
                    </option>

                    <option value="Grade 11">
                        Grade 11
                    </option>

                    <option value="Grade 12">
                        Grade 12
                    </option>

                </select>

            </div>


            <!-- TOPIC -->

            <div class="form-group">

                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Example: Cell Biology"
                >

            </div>


            <!-- EXAM TYPE -->

            <div class="form-group">

                <label for="examType">
                    Exam Type
                </label>

                <select id="examType">

                    <option value="Practice">
                        Practice
                    </option>

                    <option value="Quiz">
                        Quiz
                    </option>

                    <option value="Midterm">
                        Midterm
                    </option>

                    <option value="Final">
                        Final
                    </option>

                    <option value="Review">
                        Review
                    </option>

                </select>

            </div>


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <input
                    type="text"
                    id="year"
                    placeholder="Example: 2026"
                >

            </div>


            <!-- QUESTION COUNT -->

            <div class="form-group">

                <label for="questionCount">
                    Number of Questions
                </label>

                <input
                    type="number"
                    id="questionCount"
                    min="10"
                    max="40"
                    value="20"
                >

            </div>


            <!-- DIFFICULTY -->

            <div class="form-group">

                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>

            </div>


            <!-- QUESTION TYPE -->

            <div class="form-group">

                <label for="questionType">
                    Question Type
                </label>

                <select id="questionType">

                    <option value="multiple_choice">
                        Multiple Choice
                    </option>

                    <option value="true_false">
                        True / False
                    </option>

                    <option value="short_answer">
                        Short Answer
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group full">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Optional description for this test..."
                ></textarea>

            </div>

        </div>


        <div class="button-row">

            <button
                class="primary-btn"
                id="generateBtn"
            >
                Generate Test
            </button>

            <button
                class="secondary-btn"
                id="newTestBtn"
            >
                New Test
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </section>


    <!-- ===================================================== -->
    <!-- GENERATED TEST -->
    <!-- ===================================================== -->

    <section
        class="card hidden"
        id="testSection"
    >

        <h2 id="generatedTitle">
            Generated Test
        </h2>

        <div id="questionsContainer"></div>


        <div class="button-row">

            <button
                class="primary-btn"
                id="finishBtn"
            >
                Finish Test
            </button>

            <button
                class="success-btn"
                id="saveExamBtn"
            >
                Save Exam
            </button>

            <button
                class="secondary-btn"
                id="newTestBtn2"
            >
                New Test
            </button>

        </div>


        <!-- SCORE -->

        <div
            class="score-box"
            id="scoreBox"
        >

            <h2>
                Test Result
            </h2>

            <div
                class="score-number"
                id="scoreNumber"
            >
                0%
            </div>

            <p id="scoreDetails"></p>

        </div>

    </section>


    <!-- ===================================================== -->
    <!-- SAVE EXAM -->
    <!-- ===================================================== -->

    <section
        class="card hidden"
        id="saveSection"
    >

        <h2>
            Save Exam
        </h2>


        <div class="form-grid">

            <!-- TITLE -->

            <div class="form-group full">

                <label for="examTitle">
                    Test Title
                </label>

                <input
                    type="text"
                    id="examTitle"
                    placeholder="Example: Grade 10 Biology - Cell Biology"
                >

            </div>


            <!-- VISIBILITY -->

            <div class="form-group">

                <label for="visibility">
                    Exam Visibility
                </label>

                <select id="visibility">

                    <option value="private">
                        Private — Only me
                    </option>

                    <option value="public">
                        Public — Everyone can use it
                    </option>

                </select>

            </div>

        </div>


        <div class="button-row">

            <button
                class="success-btn"
                id="confirmSaveBtn"
            >
                Confirm Save
            </button>

            <button
                class="secondary-btn"
                id="cancelSaveBtn"
            >
                Cancel
            </button>

        </div>


        <div
            id="saveStatus"
            class="status"
        ></div>

    </section>


    <!-- ===================================================== -->
    <!-- TEST LIBRARY -->
    <!-- ===================================================== -->

    <section class="card">

        <h2>
            Test Library
        </h2>

        <p style="color:#64748b;">
            Browse public tests created by the community and use them for practice.
        </p>


        <div class="button-row">

            <button
                class="primary-btn"
                id="refreshLibraryBtn"
            >
                Refresh Library
            </button>

        </div>


        <div
            id="examList"
            class="exam-list"
        >

            <div class="loading">
                Loading public tests...
            </div>

        </div>

    </section>

</div>


<!-- ========================================================= -->
<!-- OPEN TEST MODAL -->
<!-- ========================================================= -->

<div
    class="modal"
    id="examModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalExamTitle">
                Test
            </h2>

            <button
                class="close-btn"
                id="closeModalBtn"
            >
                Close
            </button>

        </div>


        <div id="modalExamInfo"></div>


        <div class="button-row">

            <button
                class="success-btn"
                id="reuseBtn"
            >
                Use This Test
            </button>

            <button
                class="secondary-btn"
                id="closeModalBtn2"
            >
                Close
            </button>

        </div>

    </div>

</div>


<script>

    // =========================================================
    // BACKEND
    // =========================================================

    const BACKEND_URL =
        "https://text2test-backend.onrender.com";


    // =========================================================
    // GLOBAL VARIABLES
    // =========================================================

    let selectedFile = null;

    let questions = [];

    let currentExam = null;

    let currentExamQuestions = [];


    // =========================================================
    // DOM
    // =========================================================

    const fileInput =
        document.getElementById("fileInput");

    const fileName =
        document.getElementById("fileName");

    const generateBtn =
        document.getElementById("generateBtn");

    const newTestBtn =
        document.getElementById("newTestBtn");

    const newTestBtn2 =
        document.getElementById("newTestBtn2");

    const status =
        document.getElementById("status");

    const testSection =
        document.getElementById("testSection");

    const saveSection =
        document.getElementById("saveSection");

    const saveExamBtn =
        document.getElementById("saveExamBtn");

    const confirmSaveBtn =
        document.getElementById("confirmSaveBtn");

    const cancelSaveBtn =
        document.getElementById("cancelSaveBtn");

    const finishBtn =
        document.getElementById("finishBtn");

    const questionsContainer =
        document.getElementById("questionsContainer");

    const scoreBox =
        document.getElementById("scoreBox");

    const scoreNumber =
        document.getElementById("scoreNumber");

    const scoreDetails =
        document.getElementById("scoreDetails");

    const saveStatus =
        document.getElementById("saveStatus");

    const examList =
        document.getElementById("examList");

    const refreshLibraryBtn =
        document.getElementById("refreshLibraryBtn");

    const examModal =
        document.getElementById("examModal");

    const modalExamTitle =
        document.getElementById("modalExamTitle");

    const modalExamInfo =
        document.getElementById("modalExamInfo");

    const reuseBtn =
        document.getElementById("reuseBtn");

    const closeModalBtn =
        document.getElementById("closeModalBtn");

    const closeModalBtn2 =
        document.getElementById("closeModalBtn2");


    // =========================================================
    // FILE SELECTION
    // =========================================================

    fileInput.addEventListener(
        "change",
        function () {

            if (
                !this.files ||
                this.files.length === 0
            ) {

                selectedFile = null;

                fileName.textContent = "";

                return;
            }


            selectedFile =
                this.files[0];


            fileName.textContent =
                `Selected file: ${selectedFile.name}`;


            showStatus(
                "PDF selected successfully.",
                "success"
            );

        }
    );


    // =========================================================
    // STATUS
    // =========================================================

    function showStatus(
        message,
        type = "info"
    ) {

        status.textContent =
            message;

        status.className =
            `status show ${type}`;

    }


    function showSaveStatus(
        message,
        type = "info"
    ) {

        saveStatus.textContent =
            message;

        saveStatus.className =
            `status show ${type}`;

    }


    // =========================================================
    // LOAD SUBJECTS
    // =========================================================

    async function loadSubjects() {

        const subjectSelect =
            document.getElementById("subject");


        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/subjects`
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            const subjects =
                Array.isArray(data)
                    ? data
                    : data.subjects || [];


            subjectSelect.innerHTML =
                `<option value="">
                    Select a subject
                </option>`;


            subjects.forEach(
                item => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    const name =
                        item.Name ||
                        item.name ||
                        item.subject_name ||
                        "Unnamed Subject";


                    option.value =
                        item.id;


                    option.textContent =
                        name;


                    subjectSelect.appendChild(
                        option
                    );

                }
            );


        } catch (error) {

            console.error(
                "Could not load subjects:",
                error
            );


            subjectSelect.innerHTML =
                `<option value="">
                    Could not load subjects
                </option>`;

        }

    }


    // =========================================================
    // GENERATE TEST
    // =========================================================

    generateBtn.addEventListener(
        "click",
        async function () {

            if (!selectedFile) {

                showStatus(
                    "Please select a PDF file first.",
                    "error"
                );

                return;
            }


            let questionCount =
                parseInt(
                    document.getElementById(
                        "questionCount"
                    ).value,
                    10
                );


            if (
                isNaN(questionCount) ||
                questionCount < 10
            ) {

                questionCount = 10;

            }


            if (questionCount > 40) {

                questionCount = 40;

            }


            document.getElementById(
                "questionCount"
            ).value =
                questionCount;


            const difficulty =
                document.getElementById(
                    "difficulty"
                ).value;


            const questionType =
                document.getElementById(
                    "questionType"
                ).value;


            /*
             * IMPORTANT:
             *
             * This FormData is ONLY for /upload-pdf.
             *
             * Do NOT put is_public here.
             */

            const formData =
                new FormData();


            formData.append(
                "pdf",
                selectedFile
            );


            formData.append(
                "question_count",
                questionCount
            );


            formData.append(
                "difficulty",
                difficulty
            );


            formData.append(
                "question_type",
                questionType
            );


            generateBtn.disabled =
                true;


            generateBtn.textContent =
                "Generating...";


            showStatus(
                "Reading the PDF and generating your test. Please wait...",
                "info"
            );


            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/upload-pdf`,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.message ||
                        `HTTP ${response.status}`
                    );

                }


                console.log(
                    "Generate response:",
                    data
                );


                let generatedText =
                    data.test ||
                    data.questions ||
                    data.result ||
                    data.output ||
                    "";


                if (
                    typeof generatedText !==
                    "string"
                ) {

                    generatedText =
                        JSON.stringify(
                            generatedText
                        );

                }


                questions =
                    parseAIQuestions(
                        generatedText
                    );


                if (
                    !questions ||
                    questions.length === 0
                ) {

                    throw new Error(
                        "Could not read the questions from the AI response."
                    );

                }


                renderQuestions();


                const topic =
                    document.getElementById(
                        "topic"
                    ).value.trim();


                document.getElementById(
                    "generatedTitle"
                ).textContent =
                    topic
                        ? `${topic} Test`
                        : "Generated Test";


                testSection.classList.remove(
                    "hidden"
                );


                saveSection.classList.add(
                    "hidden"
                );


                scoreBox.classList.remove(
                    "show"
                );


                showStatus(
                    `Test generated successfully with ${questions.length} questions.`,
                    "success"
                );


                testSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });


            } catch (error) {

                console.error(
                    "Generate error:",
                    error
                );


                showStatus(
                    `Error: ${error.message}`,
                    "error"
                );


            } finally {

                generateBtn.disabled =
                    false;


                generateBtn.textContent =
                    "Generate Test";

            }

        }
    );


    // =========================================================
    // PARSE AI QUESTIONS
    // =========================================================

    function parseAIQuestions(text) {

        if (!text) {
            return [];
        }


        let cleanText =
            String(text).trim();


        cleanText =
            cleanText
                .replace(
                    /^```json\s*/i,
                    ""
                )
                .replace(
                    /^```\s*/i,
                    ""
                )
                .replace(
                    /\s*```$/i,
                    ""
                )
                .trim();


        // ---------------------------------------------
        // Try direct JSON
        // ---------------------------------------------

        try {

            const parsed =
                JSON.parse(cleanText);


            if (
                Array.isArray(parsed)
            ) {

                return parsed
                    .map(normalizeQuestion)
                    .filter(Boolean);

            }


            if (
                parsed.questions &&
                Array.isArray(
                    parsed.questions
                )
            ) {

                return parsed.questions
                    .map(normalizeQuestion)
                    .filter(Boolean);

            }

        } catch (error) {

            console.log(
                "Direct JSON parsing failed."
            );

        }


        // ---------------------------------------------
        // Try JSON array inside text
        // ---------------------------------------------

        const start =
            cleanText.indexOf("[");


        const end =
            cleanText.lastIndexOf("]");


        if (
            start !== -1 &&
            end !== -1 &&
            end > start
        ) {

            const jsonText =
                cleanText.substring(
                    start,
                    end + 1
                );


            try {

                const parsed =
                    JSON.parse(jsonText);


                if (
                    Array.isArray(parsed)
                ) {

                    return parsed
                        .map(
                            normalizeQuestion
                        )
                        .filter(Boolean);

                }

            } catch (error) {

                console.log(
                    "Embedded JSON parsing failed."
                );

            }

        }


        // ---------------------------------------------
        // Fallback text parser
        // ---------------------------------------------

        return parseTextQuestions(
            cleanText
        );

    }


    // =========================================================
    // TEXT PARSER
    // =========================================================

    function parseTextQuestions(text) {

        const result = [];


        const blocks =
            text.split(
                /\n(?=\s*(?:Question\s*)?\d+[\.\):])/i
            );


        blocks.forEach(
            block => {

                const lines =
                    block
                        .split("\n")
                        .map(
                            line =>
                                line.trim()
                        )
                        .filter(Boolean);


                if (
                    lines.length < 2
                ) {

                    return;

                }


                const questionText =
                    lines[0]
                        .replace(
                            /^(?:Question\s*)?\d+[\.\):]\s*/i,
                            ""
                        )
                        .trim();


                const options = [];

                let answer = "";


                lines
                    .slice(1)
                    .forEach(
                        line => {

                            const optionMatch =
                                line.match(
                                    /^([A-D])[\.\):]\s*(.+)$/i
                                );


                            if (
                                optionMatch
                            ) {

                                options.push(
                                    `${optionMatch[1].toUpperCase()}. ${optionMatch[2]}`
                                );

                                return;

                            }


                            const answerMatch =
                                line.match(
                                    /^(?:Answer|Correct Answer)\s*[:\-]\s*(.+)$/i
                                );


                            if (
                                answerMatch
                            ) {

                                answer =
                                    answerMatch[1]
                                        .trim();

                            }

                        }
                    );


                if (
                    questionText
                ) {

                    result.push(
                        normalizeQuestion({
                            question:
                                questionText,

                            options:
                                options,

                            answer:
                                answer
                        })
                    );

                }

            }
        );


        return result
            .filter(Boolean);

    }


    // =========================================================
    // NORMALIZE QUESTION
    // =========================================================

    function normalizeQuestion(q) {

        if (!q) {
            return null;
        }


        let options =
            q.options ||
            q.choices ||
            [];


        if (
            typeof options ===
            "string"
        ) {

            try {

                const parsed =
                    JSON.parse(
                        options
                    );


                if (
                    Array.isArray(
                        parsed
                    )
                ) {

                    options =
                        parsed;

                }

            } catch (error) {

                options =
                    options
                        .split(
                            /\n|;/
                        )
                        .map(
                            x =>
                                x.trim()
                        )
                        .filter(Boolean);

            }

        }


        if (
            !Array.isArray(options)
        ) {

            options = [];

        }


        return {

            question:
                String(
                    q.question ||
                    q.text ||
                    ""
                ).trim(),

            options:
                options.map(
                    option =>
                        String(
                            option
                        ).trim()
                ),

            answer:
                String(
                    q.answer ??
                    q.correct_answer ??
                    q.correctAnswer ??
                    ""
                ).trim(),

            difficulty:
                q.difficulty ||
                "medium",

            question_type:
                q.question_type ||
                q.type ||
                "multiple_choice",

            checked:
                false,

            isCorrect:
                false

        };

    }

    // =========================================================
    // CHECK QUESTION
    // =========================================================

    function checkQuestion(index) {

        const q =
            questions[index];


        const card =
            questionsContainer.children[
                index
            ];


        if (
            !q ||
            !card
        ) {

            return;

        }


        const feedback =
            card.querySelector(
                ".feedback"
            );


        const checkButton =
            card.querySelector(
                "button"
            );


        let userAnswer = "";


        const selected =
            card.querySelector(
                `input[name="question_${index}"]:checked`
            );


        if (selected) {

            userAnswer =
                selected.value.trim();

        } else {

            const textInput =
                card.querySelector(
                    ".short-answer-input"
                );


            if (textInput) {

                userAnswer =
                    textInput.value.trim();

            }

        }


        if (!userAnswer) {

            feedback.className =
                "feedback incorrect";


            feedback.textContent =
                "Please answer this question first.";

            return;

        }


        const correctAnswer =
            String(
                q.answer || ""
            ).trim();


        const userNormalized =
            normalizeAnswer(
                userAnswer
            );


        const correctNormalized =
            normalizeAnswer(
                correctAnswer
            );


        let isCorrect =
            userNormalized ===
            correctNormalized;


        if (!isCorrect) {

            const userLetter =
                extractAnswerLetter(
                    userAnswer
                );


            const correctLetter =
                extractAnswerLetter(
                    correctAnswer
                );


            if (
                userLetter &&
                correctLetter &&
                userLetter ===
                correctLetter
            ) {

                isCorrect = true;

            }

        }


        q.checked =
            true;


        q.isCorrect =
            isCorrect;


        if (isCorrect) {

            feedback.className =
                "feedback correct";


            feedback.textContent =
                "Correct!";


        } else {

            feedback.className =
                "feedback incorrect";


            feedback.textContent =
                `Incorrect. Correct answer: ${correctAnswer}`;

        }


        checkButton.disabled =
            true;

    }


    // =========================================================
    // NORMALIZE ANSWER
    // =========================================================

    function normalizeAnswer(
        answer
    ) {

        return String(answer)
            .trim()
            .toLowerCase()
            .replace(
                /\s+/g,
                " "
            )
            .replace(
                /^[a-d][\.\):]\s*/i,
                ""
            )
            .replace(
                /[.,!?]+$/g,
                ""
            )
            .trim();

    }


    function extractAnswerLetter(
        answer
    ) {

        const match =
            String(answer)
                .trim()
                .match(
                    /^([A-D])(?:[\.\):]|\s)/i
                );


        if (match) {

            return match[1]
                .toUpperCase();

        }


        return null;

    }

            /*
             * =================================================

             * This variable is called examForm.

             *
             * formData.append(...)
             *

            );

                        }

                    throw new Error(
                        data.detail ||
                        data.message ||
                        JSON.stringify(data)
                    );

                /*
                 * Get the newly created exam ID.
                 */

                const examId =
                    data.exam_id ||
                    data.id ||
                    (
                        data.exam &&
                        data.exam.id
                    );


                if (!examId) {

                    throw new Error(
                        "The exam was saved, but the backend did not return an exam ID."
                    );

                // ---------------------------------------------
                // STEP 2: Save questions
                // ---------------------------------------------

                await saveQuestions(
                    examId,

                    );

    // =========================================================
    // SAVE QUESTIONS
    // =========================================================

    async function saveQuestions(
        examId,
        questionList
    ) {

        if (
            !examId ||
            !questionList ||
            questionList.length === 0
        ) {

            return;

        }


        for (
            let i = 0;
            i < questionList.length;
            i++
        ) {

            const q =
                questionList[i];


            const questionForm =
                new FormData();


            questionForm.append(
                "exam_id",
                String(examId)
            );


            questionForm.append(
                "question",
                q.question || ""
            );


            questionForm.append(
                "options",
                JSON.stringify(
                    q.options || []
                )
            );


            questionForm.append(
                "answer",
                q.answer || ""
            );


            questionForm.append(
                "difficulty",
                q.difficulty ||
                "medium"
            );


            questionForm.append(
                "question_type",
                q.question_type ||
                "multiple_choice"
            );


            try {

                const response =
                    await fetch(
                        `${BACKEND_URL}/questions`,
                        {
                            method: "POST",
                            body: questionForm
                        }
                    );


                const result =
                    await response.json()
                        .catch(
                            () => ({})
                        );


                if (!response.ok) {

                    throw new Error(
                        result.detail ||
                        result.message ||
                        JSON.stringify(result)
                    );

                }


                console.log(
                    `Question ${i + 1} saved.`,
                    result
                );


            } catch (error) {

                console.error(
                    `Question ${i + 1} could not be saved:`,
                    error
                );


                /*
                 * Do not stop the entire process
                 * if one question fails.
                 */

            }

        }

    }

    async function loadPublicExams() {

        examList.innerHTML =
            `

            </div>
            `;


        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/exams`
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    `HTTP ${response.status}`
                );

            }


            const exams =
                Array.isArray(data)
                    ? data
                    : data.exams || [];


            /*
             * ONLY PUBLIC EXAMS
             */

            const publicExams =
                exams.filter(
                    exam =>
                        exam.is_public === true ||
                        exam.is_public === "true" ||
                        exam.is_public === 1
                );


            renderExamList(
                publicExams
            );


        } catch (error) {

            console.error(

            examList.innerHTML =
                `

                        error.message

                `;


            examModal.classList.add(
                "show"
            );


        } catch (error) {

            console.error(
                "Open exam error:",
                error
            );


            alert(
                `Could not open test: ${error.message}`
            );

        }

    }


    // =========================================================
    // USE PUBLIC TEST
    // =========================================================

    reuseBtn.addEventListener(
        "click",
        function () {

            if (
                !currentExamQuestions ||
                currentExamQuestions.length === 0
            ) {

                alert(
                    "This test does not contain any questions."
                );

                return;

            }


            questions =
                currentExamQuestions
                    .map(
                        q =>
                            normalizeQuestion(q)
                    )
                    .filter(Boolean);


            renderQuestions();


            document.getElementById(
                "generatedTitle"
            ).textContent =
                currentExam?.title ||
                "Public Test";


            testSection.classList.remove(
                "hidden"
            );


            saveSection.classList.add(
                "hidden"
            );


            scoreBox.classList.remove(
                "show"
            );


            examModal.classList.remove(
                "show"
            );


            showStatus(
                "Public test loaded successfully. You can now answer the questions.",
                "success"
            );


            testSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }
    );


    // =========================================================
    // CLOSE MODAL
    // =========================================================

    closeModalBtn.addEventListener(
        "click",
        function () {

            examModal.classList.remove(
                "show"
            );

        }
    );


    closeModalBtn2.addEventListener(
        "click",
        function () {

            examModal.classList.remove(
                "show"
            );

        }
    );


    examModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                examModal
            ) {

                examModal.classList.remove(
                    "show"
                );

            }

        }
    );


    // =========================================================
    // RESET / NEW TEST
    // =========================================================

    function resetTest() {

        selectedFile = null;

        questions = [];

        currentExam = null;

        currentExamQuestions = [];


        fileInput.value =
            "";


        fileName.textContent =
            "";


        document.getElementById(
            "subject"
        ).value =
            "";


        document.getElementById(
            "grade"
        ).value =
            "";


        document.getElementById(
            "topic"
        ).value =
            "";


        document.getElementById(
            "examType"
        ).value =
            "Practice";


        document.getElementById(
            "year"
        ).value =
            "";


        document.getElementById(
            "questionCount"
        ).value =
            "20";


        document.getElementById(
            "difficulty"
        ).value =
            "medium";


        document.getElementById(
            "questionType"
        ).value =
            "multiple_choice";


        document.getElementById(
            "description"
        ).value =
            "";


        document.getElementById(
            "examTitle"
        ).value =
            "";


        document.getElementById(
            "visibility"
        ).value =
            "private";


        questionsContainer.innerHTML =
            "";


        testSection.classList.add(
            "hidden"
        );


        saveSection.classList.add(
            "hidden"
        );


        scoreBox.classList.remove(
            "show"
        );


        status.className =
            "status";


        status.textContent =
            "";


        saveStatus.className =
            "status";


        saveStatus.textContent =
            "";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    newTestBtn.addEventListener(
        "click",
        resetTest
    );


    newTestBtn2.addEventListener(
        "click",
        resetTest
    );


    // =========================================================
    // REFRESH LIBRARY
    // =========================================================

    refreshLibraryBtn.addEventListener(
        "click",
        loadPublicExams
    );


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =========================================================
    // INITIALIZE
    // =========================================================

    window.addEventListener(
        "load",
        async function () {

            await loadSubjects();

            await loadPublicExams();

        }
    );

</script>
