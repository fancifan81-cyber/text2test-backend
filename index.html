<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text2Test AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            opacity: 0.95;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px 60px;
        }

        section {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .upload-box {
            border: 2px dashed #93c5fd;
            background: #eff6ff;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: #dbeafe;
        }

        .upload-box strong {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        #fileName {
            margin-top: 10px;
            color: #2563eb;
            font-weight: 600;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .secondary-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .success-btn {
            background: #16a34a;
            color: white;
        }

        .success-btn:hover {
            background: #15803d;
        }

        .danger-btn {
            background: #dc2626;
            color: white;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            background: #ffffff;
        }

        .question-card.checked-correct {
            border-color: #86efac;
            background: #f0fdf4;
        }

        .question-card.checked-wrong {
            border-color: #fca5a5;
            background: #fef2f2;
        }

        .question-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            margin: 8px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            font-weight: normal;
            background: white;
            transition: 0.2s;
        }

        .option-label:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option-label.selected {
            border-color: #2563eb;
            background: #dbeafe;
        }

        .option-label.correct-option {
            border-color: #22c55e;
            background: #dcfce7;
        }

        .option-label.wrong-option {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .option-label input {
            width: auto;
            margin-top: 3px;
        }

        .short-answer-input {
            margin-top: 8px;
            margin-bottom: 14px;
        }

        .question-meta {
            margin-top: 14px;
            color: #6b7280;
            font-size: 13px;
        }

        .check-answer-btn {
            background: #7c3aed;
            color: white;
            margin-top: 10px;
        }

        .check-answer-btn:hover {
            background: #6d28d9;
        }

        .feedback {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border-radius: 8px;
            font-weight: 600;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #dcfce7;
            color: #166534;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        .correct-answer {
            margin-top: 6px;
            font-weight: normal;
        }

        .score-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .score-number {
            font-size: 38px;
            font-weight: 800;
            color: #2563eb;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #6b7280;
            background: #f9fafb;
            border-radius: 10px;
        }

        .exam-item {
            border: 1px solid #e5e7eb;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .exam-item-info {
            flex: 1;
        }

        .exam-item-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .exam-item-meta {
            color: #6b7280;
            font-size: 13px;
        }

        .library-question {
            margin-bottom: 18px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #2563eb;
            font-weight: 600;
        }

        .library-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .exam-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Text2Test AI</h1>
    <p>Upload your textbook PDF to create an intelligent test.</p>
</header>

<main>

    <!-- =====================================================
         CREATE TEST
         ===================================================== -->

    <section id="createSection">

        <h2>Create Test</h2>

        <div
            class="upload-box"
            id="uploadBox"
        >
            <strong>Choose your PDF</strong>
            <span>Click here to select a textbook PDF</span>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
                hidden
            >

            <div id="fileName"></div>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label for="subject">
                    Subject
                </label>

                <select id="subject">
                    <option value="">
                        Select subject
                    </option>
                </select>
            </div>


            <div class="form-group">
                <label for="grade">
                    Grade
                </label>

                <select id="grade">
                    <option value="">
                        Select grade
                    </option>

                    <option value="Grade 6">
                        Grade 6
                    </option>

                    <option value="Grade 7">
                        Grade 7
                    </option>

                    <option value="Grade 8">
                        Grade 8
                    </option>

                    <option value="Grade 9">
                        Grade 9
                    </option>

                    <option value="Grade 10">
                        Grade 10
                    </option>

                    <option value="Grade 11">
                        Grade 11
                    </option>

                    <option value="Grade 12">
                        Grade 12
                    </option>

                    <option value="University">
                        University
                    </option>
                </select>
            </div>


            <div class="form-group">
                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="e.g. Cell Biology"
                >
            </div>


            <div class="form-group">
                <label for="examType">
                    Exam Type
                </label>

                <select id="examType">

                    <option value="Practice Test">
                        Practice Test
                    </option>

                    <option value="Midterm Exam">
                        Midterm Exam
                    </option>

                    <option value="Final Exam">
                        Final Exam
                    </option>

                    <option value="Quiz">
                        Quiz
                    </option>

                    <option value="Review Test">
                        Review Test
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    placeholder="2026"
                    min="2000"
                    max="2100"
                >
            </div>


            <div class="form-group">
                <label for="questionCount">
                    Number of Questions
                </label>

                <input
                    type="number"
                    id="questionCount"
                    value="20"
                    min="10"
                    max="40"
                >
            </div>


            <div class="form-group">
                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">

                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label for="questionType">
                    Question Type
                </label>

                <select id="questionType">

                    <option value="multiple_choice">
                        Multiple Choice
                    </option>

                    <option value="true_false">
                        True / False
                    </option>

                    <option value="short_answer">
                        Short Answer
                    </option>

                </select>
            </div>


            <div class="form-group full">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Optional description for this test..."
                ></textarea>

            </div>

        </div>


        <div class="button-row">

            <button
                id="generateBtn"
                class="primary-btn"
            >
                Generate Test
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </section>


    <!-- =====================================================
         GENERATED TEST
         ===================================================== -->

    <section
        id="generatedSection"
        class="hidden"
    >

        <h2>Generated Test</h2>

        <div id="testProgress"></div>

        <div id="questionsContainer"></div>

        <div class="button-row">

            <button
                id="finishBtn"
                class="success-btn"
            >
                Finish Test
            </button>

        </div>

        <div
            id="scoreBox"
            class="score-box hidden"
        ></div>

    </section>


    <!-- =====================================================
         SAVE TEST
         ===================================================== -->

    <section
        id="saveSection"
        class="hidden"
    >

        <h2>Save Test</h2>

        <div class="form-grid">

            <div class="form-group full">

                <label for="saveTitle">
                    Test Title
                </label>

                <input
                    type="text"
                    id="saveTitle"
                    placeholder="e.g. Biology Chapter 1 Practice Test"
                >

            </div>

        </div>

        <div class="button-row">

            <button
                id="saveExamBtn"
                class="success-btn"
            >
                Save Exam
            </button>

        </div>

        <div
            id="saveStatus"
            class="status"
        ></div>

    </section>


    <!-- =====================================================
         TEST LIBRARY
         ===================================================== -->

    <section id="librarySection">

        <h2>Test Library</h2>

        <div class="button-row">

            <button
                id="refreshLibraryBtn"
                class="secondary-btn"
            >
                Refresh Library
            </button>

        </div>

        <div
            id="examList"
            style="margin-top: 20px;"
        ></div>

    </section>


    <!-- =====================================================
         OPEN SAVED EXAM
         ===================================================== -->

    <section
        id="openExamSection"
        class="hidden"
    >

        <h2 id="libraryExamTitle">
            Saved Test
        </h2>

        <div id="libraryExamInfo"></div>

        <div
            id="libraryQuestionsContainer"
            style="margin-top: 20px;"
        ></div>

        <div class="library-actions">

            <button
                id="reuseBtn"
                class="primary-btn"
            >
                Reuse This Test
            </button>

            <button
                id="closeLibraryBtn"
                class="secondary-btn"
            >
                Close
            </button>

        </div>

    </section>

</main>


<script>

    /* =====================================================
       CONFIGURATION
       ===================================================== */

    const BACKEND_URL =
        "https://text2test-backend.onrender.com";


    /* =====================================================
       DOM ELEMENTS
       ===================================================== */

    const uploadBox =
        document.getElementById("uploadBox");

    const fileInput =
        document.getElementById("fileInput");

    const fileName =
        document.getElementById("fileName");

    const subject =
        document.getElementById("subject");

    const grade =
        document.getElementById("grade");

    const topic =
        document.getElementById("topic");

    const examType =
        document.getElementById("examType");

    const year =
        document.getElementById("year");

    const questionCount =
        document.getElementById("questionCount");

    const difficulty =
        document.getElementById("difficulty");

    const questionType =
        document.getElementById("questionType");

    const description =
        document.getElementById("description");

    const generateBtn =
        document.getElementById("generateBtn");

    const status =
        document.getElementById("status");

    const generatedSection =
        document.getElementById("generatedSection");

    const questionsContainer =
        document.getElementById("questionsContainer");

    const finishBtn =
        document.getElementById("finishBtn");

    const scoreBox =
        document.getElementById("scoreBox");

    const saveSection =
        document.getElementById("saveSection");

    const saveTitle =
        document.getElementById("saveTitle");

    const saveExamBtn =
        document.getElementById("saveExamBtn");

    const saveStatus =
        document.getElementById("saveStatus");

    const examList =
        document.getElementById("examList");

    const refreshLibraryBtn =
        document.getElementById("refreshLibraryBtn");

    const openExamSection =
        document.getElementById("openExamSection");

    const libraryExamTitle =
        document.getElementById("libraryExamTitle");

    const libraryExamInfo =
        document.getElementById("libraryExamInfo");

    const libraryQuestionsContainer =
        document.getElementById(
            "libraryQuestionsContainer"
        );

    const reuseBtn =
        document.getElementById("reuseBtn");

    const closeLibraryBtn =
        document.getElementById("closeLibraryBtn");

    const testProgress =
        document.getElementById("testProgress");


    /* =====================================================
       STATE
       ===================================================== */

    let selectedFile = null;

    let questions = [];

    let currentLibraryExam = null;

    let currentLibraryQuestions = [];


    /* =====================================================
       UTILITY
       ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function showStatus(
        message,
        type = "info"
    ) {

        status.textContent = message;

        status.className =
            "status show " + type;
    }


    function showSaveStatus(
        message,
        type = "info"
    ) {

        saveStatus.textContent =
            message;

        saveStatus.className =
            "status show " + type;
    }


    function normalizeAnswer(value) {

        return String(value ?? "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ");

    }


    function normalizeLetter(value) {

        let answer =
            normalizeAnswer(value);

        answer =
            answer.replace(
                /^option\s+/i,
                ""
            );

        answer =
            answer.replace(
                /^[\(\[]?([a-z])[\)\].:\-]?\s*.*$/i,
                "$1"
            );

        return answer;
    }


    function parseOptions(options) {

        if (!options) {
            return {};
        }

        if (
            typeof options ===
            "object"
        ) {
            return options;
        }

        if (
            typeof options ===
            "string"
        ) {

            try {

                return JSON.parse(
                    options
                );

            } catch (error) {

                return {};
            }
        }

        return {};
    }


    /* =====================================================
       FILE UPLOAD
       ===================================================== */

    uploadBox.addEventListener(
        "click",
        function() {

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        function() {

            if (
                !fileInput.files ||
                !fileInput.files.length
            ) {

                selectedFile = null;

                fileName.textContent =
                    "";

                return;
            }

            selectedFile =
                fileInput.files[0];

            fileName.textContent =
                "Selected file: " +
                selectedFile.name;

        }
    );


    /* =====================================================
       LOAD SUBJECTS
       ===================================================== */

    async function loadSubjects() {

        try {

            const response =
                await fetch(
                    BACKEND_URL +
                    "/subjects"
                );

            if (!response.ok) {

                throw new Error(
                    "Could not load subjects."
                );
            }

            const data =
                await response.json();

            subject.innerHTML =
                `
                <option value="">
                    Select subject
                </option>
                `;

            if (
                Array.isArray(data)
            ) {

                data.forEach(
                    function(item) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            item.id;

                        option.textContent =
                            item.Name ||
                            item.name ||
                            "Unknown Subject";

                        subject.appendChild(
                            option
                        );

                    }
                );
            }

        } catch (error) {

            console.error(
                "SUBJECT ERROR:",
                error
            );

            subject.innerHTML =
                `
                <option value="">
                    Select subject
                </option>
                `;

        }
    }


    /* =====================================================
       PARSE AI QUESTIONS
       ===================================================== */

    function parseAIQuestions(
        text
    ) {

        const parsed = [];

        if (
            !text ||
            typeof text !== "string"
        ) {

            return parsed;
        }


        /*
         * Split questions by numbered
         * blocks such as:
         *
         * 1. Question
         * 2. Question
         */

        const blocks =
            text.split(
                /\n(?=\s*\d+[\.\)]\s+)/
            );


        blocks.forEach(
            function(block) {

                try {

                    block =
                        block.trim();

                    if (!block) {
                        return;
                    }


                    const questionMatch =
                        block.match(
                            /^\s*\d+[\.\)]\s*(.+?)(?:\n|$)/
                        );


                    if (!questionMatch) {
                        return;
                    }


                    const questionText =
                        questionMatch[1]
                            .trim();


                    /*
                     * Detect options.
                     */

                    const optionLines =
                        block.match(
                            /(?:^|\n)\s*([A-H])[\.\):\-]\s*(.+?)(?=\n|$)/gim
                        );


                    let options = {};


                    if (
                        optionLines &&
                        optionLines.length
                    ) {

                        optionLines.forEach(
                            function(line) {

                                const match =
                                    line.match(
                                        /^\s*([A-H])[\.\):\-]\s*(.+?)\s*$/i
                                    );

                                if (match) {

                                    options[
                                        match[1]
                                            .toUpperCase()
                                    ] =
                                        match[2]
                                            .trim();

                                }

                            }
                        );

                    }


                    /*
                     * Find answer.
                     */

                    let answer = "";


                    const answerMatch =
                        block.match(
                            /(?:correct\s*answer|answer)\s*[:\-]\s*(.+?)(?=\n|$)/i
                        );


                    if (
                        answerMatch
                    ) {

                        answer =
                            answerMatch[1]
                                .trim();

                    }


                    /*
                     * Remove answer line
                     * from accidental question
                     * content.
                     */

                    let questionType =
                        "multiple_choice";


                    if (
                        Object.keys(options)
                            .length === 0
                    ) {

                        if (
                            /\btrue\s*\/?\s*false\b/i
                                .test(block) ||
                            /\btrue\b.*\bfalse\b/i
                                .test(block)
                        ) {

                            questionType =
                                "true_false";

                            options = {
                                A: "True",
                                B: "False"
                            };

                        } else {

                            questionType =
                                "short_answer";

                            options = {};

                        }

                    }


                    if (
                        questionType ===
                        "multiple_choice" &&
                        Object.keys(options)
                            .length > 0
                    ) {

                        /*
                         * Keep answer as-is.
                         */

                    }


                    if (
                        questionType ===
                        "true_false"
                    ) {

                        if (
                            /^true$/i.test(
                                answer
                            )
                        ) {

                            answer = "A";

                        } else if (
                            /^false$/i.test(
                                answer
                            )
                        ) {

                            answer = "B";

                        }

                    }


                    if (
                        questionText &&
                        answer
                    ) {

                        parsed.push({

                            question:
                                questionText,

                            options:
                                options,

                            answer:
                                answer,

                            difficulty:
                                difficulty.value ||
                                "medium",

                            question_type:
                                questionType,

                            topic:
                                topic.value ||
                                "General",

                            userAnswer:
                                "",

                            checked:
                                false,

                            isCorrect:
                                false

                        });

                    }

                } catch (error) {

                    console.error(
                        "Question parsing error:",
                        error,
                        block
                    );

                }

            }
        );


        return parsed;
    }


    /* =====================================================
       CHECK ANSWER
       ===================================================== */

    function checkQuestionAnswer(
        question,
        card,
        index,
        containerType
    ) {

        if (
            question.checked
        ) {

            return;
        }


        let userAnswer = "";


        if (
            question.question_type ===
            "short_answer"
        ) {

            const input =
                card.querySelector(
                    ".short-answer-input"
                );

            if (!input) {
                return;
            }

            userAnswer =
                input.value.trim();

            if (!userAnswer) {

                alert(
                    "Please enter your answer first."
                );

                return;
            }

        } else {

            const selected =
                card.querySelector(
                    'input[type="radio"]:checked'
                );

            if (!selected) {

                alert(
                    "Please select an answer first."
                );

                return;
            }

            userAnswer =
                selected.value;

        }


        question.userAnswer =
            userAnswer;

        question.checked =
            true;


        let correct = false;


        if (
            question.question_type ===
            "short_answer"
        ) {

            correct =
                normalizeAnswer(
                    userAnswer
                ) ===
                normalizeAnswer(
                    question.answer
                );

        } else {

            const expected =
                normalizeLetter(
                    question.answer
                );

            const actual =
                normalizeLetter(
                    userAnswer
                );

            correct =
                expected === actual;

        }


        question.isCorrect =
            correct;


        const feedback =
            card.querySelector(
                ".feedback"
            );

        const correctAnswer =
            card.querySelector(
                ".correct-answer"
            );


        if (correct) {

            feedback.className =
                "feedback show correct";

            feedback.innerHTML =
                `
                <div>Correct!</div>
                <div class="correct-answer">
                    Correct Answer:
                    ${escapeHtml(
                        question.answer
                    )}
                </div>
                `;

            card.classList.add(
                "checked-correct"
            );

        } else {

            feedback.className =
                "feedback show incorrect";

            feedback.innerHTML =
                `
                <div>Incorrect.</div>
                <div class="correct-answer">
                    Correct Answer:
                    ${escapeHtml(
                        question.answer
                    )}
                </div>
                `;

            card.classList.add(
                "checked-wrong"
            );

        }


        /*
         * Highlight correct option.
         */

        const labels =
            card.querySelectorAll(
                ".option-label"
            );


        labels.forEach(
            function(label) {

                const radio =
                    label.querySelector(
                        "input"
                    );

                if (!radio) {
                    return;
                }


                const value =
                    normalizeLetter(
                        radio.value
                    );

                const expected =
                    normalizeLetter(
                        question.answer
                    );


                if (
                    value === expected
                ) {

                    label.classList.add(
                        "correct-option"
                    );

                }


                if (
                    radio.checked &&
                    value !== expected
                ) {

                    label.classList.add(
                        "wrong-option"
                    );

                }

            }
        );


        /*
         * Disable inputs after checking.
         */

        const inputs =
            card.querySelectorAll(
                "input"
            );

        inputs.forEach(
            function(input) {

                input.disabled =
                    true;

            }
        );


        const checkButton =
            card.querySelector(
                ".check-answer-btn"
            );

        if (checkButton) {

            checkButton.disabled =
                true;

            checkButton.textContent =
                "Answer Checked";

        }


        updateProgress(
            containerType
        );

    }


    /* =====================================================
       RENDER GENERATED QUESTIONS
       ===================================================== */

    function renderQuestions() {

        questionsContainer.innerHTML =
            "";

        scoreBox.classList.add(
            "hidden"
        );

        if (
            !Array.isArray(questions) ||
            questions.length === 0
        ) {

            questionsContainer.innerHTML =
                `
                <div class="empty">
                    No questions generated.
                </div>
                `;

            return;
        }


        questions.forEach(
            function(q, index) {

                q.userAnswer =
                    "";

                q.checked =
                    false;

                q.isCorrect =
                    false;


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "question-card";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "question-title";

                title.textContent =
                    `${index + 1}. ${q.question}`;

                card.appendChild(
                    title
                );


                const options =
                    parseOptions(
                        q.options
                    );


                /*
                 * Multiple Choice / True False
                 */

                if (
                    Object.keys(options)
                        .length > 0
                ) {

                    Object.entries(
                        options
                    ).forEach(
                        function([
                            key,
                            value
                        ]) {

                            const label =
                                document.createElement(
                                    "label"
                                );

                            label.className =
                                "option-label";


                            const radio =
                                document.createElement(
                                    "input"
                                );

                            radio.type =
                                "radio";

                            radio.name =
                                "question_" +
                                index;

                            radio.value =
                                key;


                            const text =
                                document.createElement(
                                    "span"
                                );

                            text.textContent =
                                `${key}. ${value}`;


                            label.appendChild(
                                radio
                            );

                            label.appendChild(
                                text
                            );


                            radio.addEventListener(
                                "change",
                                function() {

                                    document
                                        .querySelectorAll(
                                            `input[name="question_${index}"]`
                                        )
                                        .forEach(
                                            function(
                                                other
                                            ) {

                                                const parent =
                                                    other.closest(
                                                        ".option-label"
                                                    );

                                                if (
                                                    parent
                                                ) {

                                                    parent.classList.remove(
                                                        "selected"
                                                    );

                                                }

                                            }
                                        );

                                    label.classList.add(
                                        "selected"
                                    );

                                }
                            );


                            card.appendChild(
                                label
                            );

                        }
                    );

                } else {

                    /*
                     * Short answer.
                     */

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "text";

                    input.className =
                        "short-answer-input";

                    input.placeholder =
                        "Type your answer here...";

                    card.appendChild(
                        input
                    );

                }


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "question-meta";

                meta.textContent =
                    `Type: ${q.question_type || "unknown"} | Difficulty: ${q.difficulty || "unknown"}`;

                card.appendChild(
                    meta
                );


                const checkButton =
                    document.createElement(
                        "button"
                    );

                checkButton.className =
                    "check-answer-btn";

                checkButton.textContent =
                    "Check Answer";


                checkButton.addEventListener(
                    "click",
                    function() {

                        checkQuestionAnswer(
                            q,
                            card,
                            index,
                            "generated"
                        );

                    }
                );


                card.appendChild(
                    checkButton
                );


                const feedback =
                    document.createElement(
                        "div"
                    );

                feedback.className =
                    "feedback";


                card.appendChild(
                    feedback
                );


                questionsContainer.appendChild(
                    card
                );

            }
        );


        updateProgress(
            "generated"
        );
    }


    /* =====================================================
       PROGRESS
       ===================================================== */

    function updateProgress(
        type
    ) {

        const list =
            type === "generated"
                ? questions
                : currentLibraryQuestions;


        if (
            !Array.isArray(list) ||
            !list.length
        ) {

            testProgress.textContent =
                "";

            return;
        }


        const checked =
            list.filter(
                function(q) {
                    return q.checked;
                }
            ).length;


        if (
            type === "generated"
        ) {

            testProgress.innerHTML =
                `
                <div
                    style="
                        margin-bottom:18px;
                        color:#6b7280;
                        font-weight:600;
                    "
                >
                    Answered:
                    ${checked}
                    /
                    ${list.length}
                </div>
                `;

        }

    }


    /* =====================================================
       GENERATE TEST
       ===================================================== */

    generateBtn.addEventListener(
        "click",
        async function() {

            try {

                if (!selectedFile) {

                    showStatus(
                        "Please select a PDF file first.",
                        "error"
                    );

                    return;
                }


                let count =
                    parseInt(
                        questionCount.value,
                        10
                    );


                if (
                    isNaN(count)
                ) {

                    count = 20;
                }


                count =
                    Math.max(
                        10,
                        Math.min(
                            count,
                            40
                        )
                    );


                questionCount.value =
                    count;


                generateBtn.disabled =
                    true;

                generateBtn.textContent =
                    "Generating...";


                showStatus(
                    "Uploading PDF and generating your test. Please wait...",
                    "info"
                );


                const formData =
                    new FormData();


                formData.append(
                    "pdf",
                    selectedFile
                );

                formData.append(
                    "question_count",
                    count
                );

                formData.append(
                    "difficulty",
                    difficulty.value
                );

                formData.append(
                    "question_type",
                    questionType.value
                );


                const response =
                    await fetch(
                        BACKEND_URL +
                        "/upload-pdf",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Test generation failed."
                    );
                }


                /*
                 * Parse AI output.
                 */

                questions =
                    parseAIQuestions(
                        data.test
                    );


                /*
                 * If the normal parser fails,
                 * show the raw response in console.
                 */

                if (
                    questions.length === 0
                ) {

                    console.error(
                        "RAW AI RESPONSE:",
                        data.test
                    );

                    throw new Error(
                        "Could not read the questions from the AI response."
                    );
                }


                /*
                 * Keep only requested amount.
                 */

                questions =
                    questions.slice(
                        0,
                        count
                    );


                renderQuestions();


                generatedSection.classList.remove(
                    "hidden"
                );

                saveSection.classList.remove(
                    "hidden"
                );


                saveTitle.value =
                    (
                        subject.options[
                            subject.selectedIndex
                        ]?.textContent ||
                        "Generated"
                    ) +
                    " Test";


                showStatus(
                    `Successfully generated ${questions.length} questions. Select an answer and click "Check Answer" to reveal the correct answer.`,
                    "success"
                );


                generatedSection.scrollIntoView({
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(
                    "GENERATE ERROR:",
                    error
                );

                showStatus(
                    "AI generation failed: " +
                    error.message,
                    "error"
                );

            } finally {

                generateBtn.disabled =
                    false;

                generateBtn.textContent =
                    "Generate Test";

            }

        }
    );


    /* =====================================================
       FINISH TEST
       ===================================================== */

    finishBtn.addEventListener(
        "click",
        function() {

            if (
                !questions.length
            ) {

                return;
            }


            const unanswered =
                questions.filter(
                    function(q) {
                        return !q.checked;
                    }
                );


            if (
                unanswered.length > 0
            ) {

                alert(
                    `Please check all answers before finishing the test.\n\n${unanswered.length} question(s) have not been checked yet.`
                );

                return;
            }


            const correct =
                questions.filter(
                    function(q) {
                        return q.isCorrect;
                    }
                ).length;


            const total =
                questions.length;


            const percentage =
                Math.round(
                    (
                        correct /
                        total
                    ) *
                    100
                );


            scoreBox.innerHTML =
                `
                <div>
                    <div class="score-number">
                        ${percentage}%
                    </div>

                    <h3>
                        Test Completed
                    </h3>

                    <p>
                        You answered
                        <strong>
                            ${correct}
                        </strong>
                        out of
                        <strong>
                            ${total}
                        </strong>
                        questions correctly.
                    </p>
                </div>
                `;


            scoreBox.classList.remove(
                "hidden"
            );


            scoreBox.scrollIntoView({
                behavior: "smooth"
            });

        }
    );

       ===================================================== */

    saveExamBtn.addEventListener(
        "click",
        async function() {

            try {

                if (
                    !questions.length
                ) {

                    showSaveStatus(
                        "There are no questions to save.",
                        "error"
                    );

                    return;
                }


                const title =
                    saveTitle.value.trim();


                if (!title) {

                    showSaveStatus(
                        "Please enter a test title.",
                        "error"
                    );

                    return;
                }


                if (!subject.value) {

                    showSaveStatus(
                        "Please select a subject.",
                        "error"
                    );

                    return;
                }


                saveExamBtn.disabled =
                    true;

                saveExamBtn.textContent =
                    "Saving...";


                showSaveStatus(
                    "Saving test...",
                    "info"
                );


                /*
                 * Save only backend fields.
                 * Do not save userAnswer / checked.
                 */

                const examPayload = {

                    title:
                        title,

                    subject_id:
                        Number(
                            subject.value
                        ),

                    grade:
                        grade.value ||
                        "",

                    topic:
                        topic.value ||
                        "General",

                    exam_type:
                        examType.value ||
                        "Practice Test",

                    year:
                        year.value
                            ? Number(
                                year.value
                            )
                            : null,

                    description:
                        description.value ||
                        "",

                    file_url:
                        "",

                    answer_url:
                        ""

                };


                const examResponse =
                    await fetch(
                        BACKEND_URL +
                        "/save-exam",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    examPayload
                                )
                        }
                    );


                const examData =
                    await examResponse.json();


                if (
                    !examResponse.ok ||
                    !examData.success
                ) {

                    throw new Error(
                        examData.error ||
                        "Could not save exam."
                    );
                }


                const examId =
                    examData.exam_id ||
                    examData.id ||
                    (
                        examData.exam &&
                        examData.exam.id
                    );


                if (!examId) {

                    throw new Error(
                        "Exam was created but no exam ID was returned."
                    );
                }


                /*
                 * Save questions.
                 */

                const questionPayload =
                    questions.map(
                        function(q) {

                            return {

                                exam_id:
                                    examId,

                                question:
                                    q.question,

                                options:
                                    parseOptions(
                                        q.options
                                    ),

                                answer:
                                    q.answer,

                                difficulty:
                                    q.difficulty ||
                                    difficulty.value,

                                question_type:
                                    q.question_type ||
                                    questionType.value

                            };

                        }
                    );


                const questionsResponse =
                    await fetch(
                        BACKEND_URL +
                        "/questions",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    questionPayload
                                )
                        }
                    );


                const questionsData =
                    await questionsResponse.json();


                if (
                    !questionsResponse.ok ||
                    !questionsData.success
                ) {

                    throw new Error(
                        questionsData.error ||
                        "Could not save questions."
                    );
                }


                showSaveStatus(
                    "Test saved successfully!",
                    "success"
                );


                await loadLibrary();


            } catch (error) {

                console.error(
                    "SAVE ERROR:",
                    error
                );

                showSaveStatus(
                    "Could not save test: " +
                    error.message,
                    "error"
                );

            } finally {

                saveExamBtn.disabled =
                    false;

                saveExamBtn.textContent =
                    "Save Exam";

            }

        }
    );

                `

                                currentLibraryExam.topic ||
                                "General",

                            userAnswer:
                                "",

                            checked:
                                false,

                            isCorrect:
                                false

                        };

                    }
                );


            renderQuestions();


            generatedSection.classList.remove(
                "hidden"
            );


            saveSection.classList.remove(
                "hidden"
            );


            saveTitle.value =
                currentLibraryExam.title ||
                "Reused Test";


            generatedSection.scrollIntoView({
                behavior: "smooth"
            });


            showStatus(
                "Test loaded. You can now take it again.",
                "success"
            );

        }
    );


    /* =====================================================
       CLOSE LIBRARY EXAM
       ===================================================== */

    closeLibraryBtn.addEventListener(
        "click",
        function() {

            openExamSection.classList.add(
                "hidden"
            );

        }
    );


    /* =====================================================
       REFRESH LIBRARY
       ===================================================== */

    refreshLibraryBtn.addEventListener(
        "click",
        function() {

            loadLibrary();

        }
    );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        async function() {

            await loadSubjects();

            await loadLibrary();

        }
    );


</script>

</body>
</html>
