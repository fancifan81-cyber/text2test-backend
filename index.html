<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text2Test AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 24px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        nav {
            background: white;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav button {
            border: none;
            background: #eef2ff;
            color: #1e40af;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button.active {
            background: #2563eb;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 9px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .purple {
            background: #7c3aed;
            color: white;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .question-number {
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: normal;
        }

        .option:hover {
            background: #f1f5f9;
        }

        .option input {
            width: auto;
            margin: 3px 0 0;
        }

        .answer-feedback {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .answer-feedback.correct {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .answer-feedback.wrong {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .exam-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            background: white;
        }

        .exam-card h3 {
            margin-bottom: 10px;
        }

        .exam-meta {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge.public {
            background: #dcfce7;
            color: #166534;
        }

        .badge.private {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }

        .score-box {
            text-align: center;
            padding: 25px;
            background: #eff6ff;
            border-radius: 12px;
            margin-top: 20px;
        }

        .score-number {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .grid,
            .library-grid {
                grid-template-columns: 1fr;
            }

            nav {
                flex-wrap: wrap;
            }

            .container {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Text2Test AI</h1>
    <p>Upload your textbook PDF to create an intelligent test.</p>
</header>

<nav>
    <button id="createTab" class="active" onclick="showSection('createSection', this)">
        Create Test
    </button>

    <button id="libraryTab" onclick="showSection('librarySection', this)">
        Test Library
    </button>
</nav>

<div class="container">

    <!-- ========================================================= -->
    <!-- CREATE TEST -->
    <!-- ========================================================= -->

    <section id="createSection" class="section active">

        <div class="card">

            <h2>Create a New Test</h2>

            <form id="testForm">

                <label for="fileInput">
                    Textbook PDF
                </label>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,application/pdf"
                    required
                >

                <div class="grid">

                    <div>
                        <label for="subject">
                            Subject
                        </label>

                        <select id="subject" required>
                            <option value="">Loading subjects...</option>
                        </select>
                    </div>

                    <div>
                        <label for="grade">
                            Grade
                        </label>

                        <select id="grade" required>
                            <option value="">Select grade</option>
                            <option value="Grade 6">Grade 6</option>
                            <option value="Grade 7">Grade 7</option>
                            <option value="Grade 8">Grade 8</option>
                            <option value="Grade 9">Grade 9</option>
                            <option value="Grade 10">Grade 10</option>
                            <option value="Grade 11">Grade 11</option>
                            <option value="Grade 12">Grade 12</option>
                        </select>
                    </div>

                    <div>
                        <label for="topic">
                            Topic
                        </label>

                        <input
                            type="text"
                            id="topic"
                            placeholder="e.g. Cell Biology"
                        >
                    </div>

                    <div>
                        <label for="examType">
                            Exam Type
                        </label>

                        <select id="examType">
                            <option value="Practice">Practice</option>
                            <option value="Quiz">Quiz</option>
                            <option value="Midterm">Midterm</option>
                            <option value="Final">Final</option>
                            <option value="Revision">Revision</option>
                        </select>
                    </div>

                    <div>
                        <label for="year">
                            Year
                        </label>

                        <input
                            type="text"
                            id="year"
                            placeholder="e.g. 2026"
                        >
                    </div>

                    <div>
                        <label for="questionCount">
                            Number of Questions
                        </label>

                        <input
                            type="number"
                            id="questionCount"
                            min="10"
                            max="40"
                            value="20"
                            required
                        >
                    </div>

                    <div>
                        <label for="difficulty">
                            Difficulty
                        </label>

                        <select id="difficulty">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>

                    <div>
                        <label for="questionType">
                            Question Type
                        </label>

                        <select id="questionType">
                            <option value="multiple_choice">
                                Multiple Choice
                            </option>

                            <option value="true_false">
                                True / False
                            </option>

                            <option value="short_answer">
                                Short Answer
                            </option>
                        </select>
                    </div>

                </div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Optional description..."
                ></textarea>

                <button
                    type="submit"
                    class="primary"
                    id="generateButton"
                >
                    Generate Test
                </button>

            </form>

            <div id="generateStatus" class="status"></div>

        </div>

        <!-- ===================================================== -->
        <!-- GENERATED TEST -->
        <!-- ===================================================== -->

        <div id="generatedSection" class="card hidden">

            <h2 id="generatedTitle">
                Generated Test
            </h2>

            <div id="questionsContainer"></div>

            <div class="button-row">

                <button
                    class="success"
                    onclick="finishTest()"
                >
                    Finish Test
                </button>

                <button
                    class="purple"
                    onclick="openSavePanel()"
                >
                    Save Exam
                </button>

                <button
                    class="secondary"
                    onclick="newTest()"
                >
                    New Test
                </button>

            </div>

            <div id="scoreBox" class="score-box hidden">
                <div>Your Score</div>
                <div id="scoreNumber" class="score-number">
                    0%
                </div>
                <div id="scoreText"></div>
            </div>

        </div>

        <!-- ===================================================== -->
        <!-- SAVE EXAM -->
        <!-- ===================================================== -->

        <div id="savePanel" class="card hidden">

            <h2>Save Exam</h2>

            <p>
                Choose whether other users can access this exam.
            </p>

            <label for="saveVisibility">
                Visibility
            </label>

            <select id="saveVisibility">
                <option value="false">
                    Private
                </option>

                <option value="true">
                    Public
                </option>
            </select>

            <div class="button-row">

                <button
                    class="success"
                    id="saveExamButton"
                    onclick="saveExam()"
                >
                    Save Exam
                </button>

                <button
                    class="secondary"
                    onclick="closeSavePanel()"
                >
                    Cancel
                </button>

            </div>

            <div id="saveStatus" class="status"></div>

        </div>

    </section>


    <!-- ========================================================= -->
    <!-- TEST LIBRARY -->
    <!-- ========================================================= -->

    <section id="librarySection" class="section">

        <div class="card">

            <h2>Public Test Library</h2>

            <p>
                Browse tests shared by other users.
            </p>

            <button
                class="primary"
                onclick="loadLibrary()"
            >
                Refresh Library
            </button>

        </div>

        <div id="libraryContainer" class="library-grid">
            <div class="loading">
                Loading public tests...
            </div>
        </div>

    </section>


    <!-- ========================================================= -->
    <!-- SAVED TEST -->
    <!-- ========================================================= -->

    <section id="savedTestSection" class="section">

        <div class="card">

            <div class="button-row">

                <button
                    class="secondary"
                    onclick="closeSavedTest()"
                >
                    ← Back to Library
                </button>

                <button
                    class="primary"
                    onclick="useCurrentSavedTest()"
                >
                    Use This Test
                </button>

            </div>

        </div>

        <div
            id="savedTestContainer"
            class="card"
        ></div>

    </section>

</div>


<script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const BACKEND_URL =
        "https://text2test-backend.onrender.com";


    // ============================================================
    // GLOBAL STATE
    // ============================================================

    let questions = [];

    let currentExam = null;

    let currentSavedExam = null;

    let subjects = [];


    // ============================================================
    // INITIAL LOAD
    // ============================================================

    document.addEventListener("DOMContentLoaded", async () => {

        await loadSubjects();

        await loadLibrary();

    });


    // ============================================================
    // SECTION NAVIGATION
    // ============================================================

    function showSection(sectionId, button = null) {

        document
            .querySelectorAll(".section")
            .forEach(section => {
                section.classList.remove("active");
            });

        const section =
            document.getElementById(sectionId);

        if (section) {
            section.classList.add("active");
        }

        document
            .querySelectorAll("nav button")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        if (button) {
            button.classList.add("active");
        }

        if (sectionId === "librarySection") {
            loadLibrary();
        }
    }


    // ============================================================
    // STATUS MESSAGE
    // ============================================================

    function showStatus(
        elementId,
        message,
        type = "info"
    ) {

        const element =
            document.getElementById(elementId);

        if (!element) return;

        element.textContent = message;

        element.className =
            `status show ${type}`;
    }


    function hideStatus(elementId) {

        const element =
            document.getElementById(elementId);

        if (!element) return;

        element.className = "status";
        element.textContent = "";
    }


    // ============================================================
    // LOAD SUBJECTS
    // ============================================================

    async function loadSubjects() {

        const subjectSelect =
            document.getElementById("subject");

        try {

            const response =
                await fetch(`${BACKEND_URL}/subjects`);

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            subjects =
                Array.isArray(data)
                    ? data
                    : (data.subjects || []);

            subjectSelect.innerHTML =
                '<option value="">Select subject</option>';

            subjects.forEach(item => {

                const id =
                    item.id;

                const name =
                    item.Name ||
                    item.name ||
                    item.subject_name ||
                    "";

                if (!name) return;

                const option =
                    document.createElement("option");

                option.value = id;

                option.textContent = name;

                subjectSelect.appendChild(option);

            });

        } catch (error) {

            console.error(
                "Failed to load subjects:",
                error
            );

            subjectSelect.innerHTML = `
                <option value="">
                    Failed to load subjects
                </option>
            `;
        }
    }


    // ============================================================
    // GENERATE TEST
    // ============================================================

    document
        .getElementById("testForm")
        .addEventListener(
            "submit",
            generateTest
        );


    async function generateTest(event) {

        event.preventDefault();

        const file =
            document.getElementById("fileInput").files[0];

        if (!file) {

            showStatus(
                "generateStatus",
                "Please select a PDF file.",
                "error"
            );

            return;
        }

        const questionCount =
            Math.max(
                10,
                Math.min(
                    40,
                    parseInt(
                        document.getElementById(
                            "questionCount"
                        ).value,
                        10
                    ) || 20
                )
            );

        document
            .getElementById("questionCount")
            .value = questionCount;

        const formData =
            new FormData();

        formData.append(
            "pdf",
            file
        );

        formData.append(
            "question_count",
            questionCount
        );

        formData.append(
            "difficulty",
            document.getElementById(
                "difficulty"
            ).value
        );

        formData.append(
            "question_type",
            document.getElementById(
                "questionType"
            ).value
        );

        const button =
            document.getElementById(
                "generateButton"
            );

        button.disabled = true;

        button.textContent =
            "Generating...";

        showStatus(
            "generateStatus",
            "Uploading the PDF and generating your test. This may take a moment...",
            "info"
        );

        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/upload-pdf`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const rawText =
                await response.text();

            let data;

            try {
                data = JSON.parse(rawText);
            } catch {
                throw new Error(
                    rawText || "Invalid server response."
                );
            }

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    `Server error: ${response.status}`
                );
            }

            const rawTest =
                data.test ||
                data.questions ||
                data.result ||
                data.output ||
                "";

            if (!rawTest) {

                throw new Error(
                    "The AI returned an empty test."
                );
            }

            questions =
                parseAIQuestions(rawTest);

            if (
                !Array.isArray(questions) ||
                questions.length === 0
            ) {

                console.error(
                    "Raw AI response:",
                    rawTest
                );

                throw new Error(
                    "Could not read the questions from the AI response."
                );
            }

            const subjectSelect =
                document.getElementById("subject");

            const selectedSubject =
                subjectSelect.options[
                    subjectSelect.selectedIndex
                ];

            const subjectName =
                selectedSubject
                    ? selectedSubject.textContent
                    : "";

            currentExam = {

                title:
                    `${subjectName || "AI"} Test`,

                subject_id:
                    document.getElementById(
                        "subject"
                    ).value,

                grade:
                    document.getElementById(
                        "grade"
                    ).value,

                topic:
                    document.getElementById(
                        "topic"
                    ).value.trim(),

                exam_type:
                    document.getElementById(
                        "examType"
                    ).value,

                year:
                    document.getElementById(
                        "year"
                    ).value.trim(),

                description:
                    document.getElementById(
                        "description"
                    ).value.trim(),

                file_url: "",

                answer_url: ""

            };

            renderQuestions(
                questions,
                "questionsContainer"
            );

            document
                .getElementById(
                    "generatedSection"
                )
                .classList.remove("hidden");

            document
                .getElementById(
                    "savePanel"
                )
                .classList.add("hidden");

            document
                .getElementById(
                    "scoreBox"
                )
                .classList.add("hidden");

            document
                .getElementById(
                    "generatedTitle"
                )
                .textContent =
                    currentExam.title;

            showStatus(
                "generateStatus",
                `Test generated successfully with ${questions.length} questions.`,
                "success"
            );

            window.scrollTo({
                top: document
                    .getElementById(
                        "generatedSection"
                    )
                    .offsetTop - 20,
                behavior: "smooth"
            });

        } catch (error) {

            console.error(
                "Generate test error:",
                error
            );

            showStatus(
                "generateStatus",
                `Error: ${error.message}`,
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Generate Test";
        }
    }


    // ============================================================
    // PARSE AI RESPONSE
    // ============================================================

    function parseAIQuestions(raw) {

        if (
            Array.isArray(raw)
        ) {
            return raw
                .map(normalizeQuestion)
                .filter(Boolean);
        }

        if (
            typeof raw === "object" &&
            raw !== null
        ) {

            if (Array.isArray(raw.questions)) {

                return raw.questions
                    .map(normalizeQuestion)
                    .filter(Boolean);
            }

            if (Array.isArray(raw.data)) {

                return raw.data
                    .map(normalizeQuestion)
                    .filter(Boolean);
            }
        }

        const text =
            String(raw)
                .trim();

        // --------------------------------------------------------
        // Try JSON
        // --------------------------------------------------------

        const jsonCandidates = [
            text,
            text
                .replace(/^```json\s*/i, "")
                .replace(/^```\s*/i, "")
                .replace(/```\s*$/i, "")
                .trim()
        ];

        for (
            const candidate
            of jsonCandidates
        ) {

            try {

                const parsed =
                    JSON.parse(candidate);

                if (Array.isArray(parsed)) {

                    return parsed
                        .map(normalizeQuestion)
                        .filter(Boolean);
                }

                if (
                    parsed &&
                    Array.isArray(
                        parsed.questions
                    )
                ) {

                    return parsed.questions
                        .map(normalizeQuestion)
                        .filter(Boolean);
                }

            } catch {
                // Continue.
            }
        }

        // --------------------------------------------------------
        // Try extracting JSON array from response
        // --------------------------------------------------------

        const firstBracket =
            text.indexOf("[");

        const lastBracket =
            text.lastIndexOf("]");

        if (
            firstBracket !== -1 &&
            lastBracket > firstBracket
        ) {

            const possibleJson =
                text.substring(
                    firstBracket,
                    lastBracket + 1
                );

            try {

                const parsed =
                    JSON.parse(possibleJson);

                if (Array.isArray(parsed)) {

                    return parsed
                        .map(normalizeQuestion)
                        .filter(Boolean);
                }

            } catch {
                // Continue.
            }
        }

        // --------------------------------------------------------
        // Plain text parser
        // --------------------------------------------------------

        return parsePlainTextQuestions(text);
    }


    // ============================================================
    // NORMALIZE QUESTION
    // ============================================================

    function normalizeQuestion(item) {

        if (!item) {
            return null;
        }

        if (
            typeof item !== "object"
        ) {
            return null;
        }

        const questionText =
            item.question ||
            item.question_text ||
            item.text ||
            item.prompt ||
            "";

        if (
            !String(questionText).trim()
        ) {
            return null;
        }

        let options =
            item.options ||
            item.choices ||
            item.answers ||
            [];

        if (
            typeof options === "object" &&
            !Array.isArray(options) &&
            options !== null
        ) {

            options = [
                options.A,
                options.B,
                options.C,
                options.D
            ].filter(
                value =>
                    value !== undefined &&
                    value !== null
            );
        }

        if (!Array.isArray(options)) {

            options =
                String(options)
                    .split(/\n/)
                    .map(x => x.trim())
                    .filter(Boolean);
        }

        options =
            options.map(
                option =>
                    typeof option === "object"
                        ? (
                            option.text ||
                            option.value ||
                            option.answer ||
                            ""
                        )
                        : String(option)
            );


        let answer =
            item.answer ??
            item.correct_answer ??
            item.correctAnswer ??
            item.correct ??
            item.solution ??
            "";

        if (
            typeof answer === "object" &&
            answer !== null
        ) {

            answer =
                answer.letter ||
                answer.option ||
                answer.text ||
                answer.answer ||
                answer.value ||
                "";
        }

        return {

            question:
                String(questionText).trim(),

            options:
                options,

            answer:
                String(answer).trim(),

            difficulty:
                String(
                    item.difficulty ||
                    document.getElementById(
                        "difficulty"
                    ).value ||
                    "medium"
                ).toLowerCase(),

            question_type:
                item.question_type ||
                item.type ||
                document.getElementById(
                    "questionType"
                ).value ||
                "multiple_choice",

            checked: false,

            isCorrect: false
        };
    }


    // ============================================================
    // PLAIN TEXT PARSER
    // ============================================================

    function parsePlainTextQuestions(text) {

        const cleaned =
            text
                .replace(/\r/g, "")
                .replace(/^```[a-zA-Z]*\s*/gm, "")
                .replace(/```$/gm, "")
                .trim();

        const blocks =
            cleaned
                .split(
                    /(?=^\s*(?:Question\s*)?\d+\s*[\.\):])/gim
                )
                .map(
                    block =>
                        block.trim()
                )
                .filter(Boolean);

        const result = [];

        for (const block of blocks) {

            const questionMatch =
                block.match(
                    /^(?:Question\s*)?\d+\s*[\.\):]\s*([\s\S]*?)(?=\n\s*[A-D][\.\):]\s*|\n\s*Answer\s*:)/i
                );

            if (!questionMatch) {
                continue;
            }

            const questionText =
                questionMatch[1]
                    .trim();

            const optionMatches =
                [
                    ...block.matchAll(
                        /(?:^|\n)\s*([A-D])[\.\):]\s*(.+?)(?=\n\s*[A-D][\.\):]\s*|\n\s*(?:Answer|Correct Answer)\s*:|$)/gis
                    )
                ];

            const options =
                optionMatches.map(
                    match =>
                        `${match[1].toUpperCase()}. ${match[2].trim()}`
                );

            const answerMatch =
                block.match(
                    /(?:Correct\s+Answer|Answer)\s*:\s*(.+)$/is
                );

            const answer =
                answerMatch
                    ? answerMatch[1]
                        .trim()
                        .split(/\n/)[0]
                    : "";

            if (!questionText) {
                continue;
            }

            result.push({

                question:
                    questionText,

                options:
                    options,

                answer:
                    answer,

                difficulty:
                    document.getElementById(
                        "difficulty"
                    ).value,

                question_type:
                    document.getElementById(
                        "questionType"
                    ).value,

                checked: false,

                isCorrect: false
            });
        }

        return result;
    }

    // ============================================================
    // ANSWER NORMALIZATION
    // ============================================================

    function normalizeAnswer(value) {

        return String(
            value ?? ""
        )
            .trim()
            .toLowerCase()
            .replace(/\s+/g, " ")
            .replace(
                /^[a-d][\.\):\]\-]\s*/i,
                ""
            )
            .replace(
                /^(?:option|answer)\s*[:\-]?\s*[a-d][\.\):\]\-]?\s*/i,
                ""
            )
            .replace(
                /[.,!?]+$/g,
                ""
            )
            .trim();
    }


    // ============================================================
    // EXTRACT ANSWER LETTER
    // ============================================================

    function extractAnswerLetter(value) {

        const text =
            String(value ?? "")
                .trim();

        // A
        let match =
            text.match(
                /^([A-D])$/i
            );

        if (match) {
            return match[1].toUpperCase();
        }

        // A. text / A) text / A: text / A - text
        match =
            text.match(
                /^([A-D])[\.\):\]\-]\s*/i
            );

        if (match) {
            return match[1].toUpperCase();
        }

        // Option A / Answer A / Correct Answer: A
        match =
            text.match(
                /^(?:option|answer|correct\s+answer)\s*[:\-]?\s*([A-D])\b/i
            );

        if (match) {
            return match[1].toUpperCase();
        }

        // "The correct answer is B"
        match =
            text.match(
                /(?:correct\s+answer|answer)\s*(?:is|:|-)?\s*([A-D])\b/i
            );

        if (match) {
            return match[1].toUpperCase();
        }

        return null;
    }


    // ============================================================
    // GET OPTION LETTER
    // ============================================================

    function getOptionLetter(
        option,
        index
    ) {

        const letter =
            extractAnswerLetter(option);

        if (letter) {
            return letter;
        }

        if (
            index >= 0 &&
            index < 4
        ) {
            return String.fromCharCode(
                65 + index
            );
        }

        return null;
    }


    // ============================================================
    // COMPARE ANSWERS
    // ============================================================

    function answersMatch(
        userAnswer,
        correctAnswer,
        q
    ) {

        const userText =
            String(
                userAnswer ?? ""
            ).trim();

        const correctText =
            String(
                correctAnswer ?? ""
            ).trim();

        if (
            !userText ||
            !correctText
        ) {
            return false;
        }


        // --------------------------------------------------------
        // 1. Compare answer letters
        // --------------------------------------------------------

        const userLetter =
            extractAnswerLetter(
                userText
            );

        const correctLetter =
            extractAnswerLetter(
                correctText
            );

        if (
            userLetter &&
            correctLetter
        ) {

            return (
                userLetter ===
                correctLetter
            );
        }


        // --------------------------------------------------------
        // 2. If correct answer is A/B/C/D,
        //    compare selected option with that option.
        // --------------------------------------------------------

        if (
            correctLetter &&
            Array.isArray(q.options)
        ) {

            const correctIndex =
                correctLetter.charCodeAt(0) -
                65;

            const correctOption =
                q.options[
                    correctIndex
                ];

            if (correctOption) {

                if (
                    normalizeAnswer(
                        userText
                    ) ===
                    normalizeAnswer(
                        correctOption
                    )
                ) {
                    return true;
                }
            }
        }


        // --------------------------------------------------------
        // 3. If selected answer has A/B/C/D,
        //    compare its option text with correct answer.
        // --------------------------------------------------------

        if (
            userLetter &&
            Array.isArray(q.options)
        ) {

            const userIndex =
                userLetter.charCodeAt(0) -
                65;

            const userOption =
                q.options[
                    userIndex
                ];

            if (userOption) {

                if (
                    normalizeAnswer(
                        userOption
                    ) ===
                    normalizeAnswer(
                        correctText
                    )
                ) {
                    return true;
                }
            }
        }


        // --------------------------------------------------------
        // 4. Normal text comparison
        // --------------------------------------------------------

        if (
            normalizeAnswer(
                userText
            ) ===
            normalizeAnswer(
                correctText
            )
        ) {
            return true;
        }


        // --------------------------------------------------------
        // 5. Remove option prefixes and compare again
        // --------------------------------------------------------

        const cleanUser =
            normalizeAnswer(
                userText
            );

        const cleanCorrect =
            normalizeAnswer(
                correctText
            );

        if (
            cleanUser === cleanCorrect
        ) {
            return true;
        }


        return false;
    }


    // ============================================================
    // CHECK QUESTION
    // ============================================================

    function checkQuestion(index) {

        const q =
            questions[index];

        if (!q) return;

        const card =
            document.querySelectorAll(
                ".question-card"
            )[index];

        if (!card) return;


        let userAnswer = "";


        // Multiple choice / True False
        const selected =
            card.querySelector(
                `input[name="question_${index}"]:checked`
            );

        if (selected) {

            userAnswer =
                selected.value.trim();

        } else {

            // Short answer
            const textInput =
                card.querySelector(
                    `input[name="question_${index}"]`
                );

            if (textInput) {

                userAnswer =
                    textInput.value.trim();
            }
        }


        const feedback =
            document.getElementById(
                `feedback_${index}`
            );


        if (!userAnswer) {

            feedback.className =
                "answer-feedback wrong";

            feedback.textContent =
                "Please select or enter an answer.";

            return;
        }


        const isCorrect =
            answersMatch(
                userAnswer,
                q.answer,
                q
            );


        q.checked = true;

        q.isCorrect =
            isCorrect;


        if (isCorrect) {

            feedback.className =
                "answer-feedback correct";

            feedback.textContent =
                "✓ Correct!";

        } else {

            feedback.className =
                "answer-feedback wrong";

            feedback.textContent =
                `✗ Incorrect. Correct answer: ${q.answer}`;
        }
    }


    // ============================================================
    // FINISH TEST
    // ============================================================

    function finishTest() {

        if (
            !questions ||
            questions.length === 0
        ) {
            return;
        }


        const unanswered =
            questions.filter(
                q => !q.checked
            ).length;


        if (unanswered > 0) {

            const confirmFinish =
                confirm(
                    `${unanswered} question(s) have not been checked. Finish anyway?`
                );

            if (!confirmFinish) {
                return;
            }
        }


        const correct =
            questions.filter(
                q => q.isCorrect
            ).length;

        const total =
            questions.length;

        const percentage =
            Math.round(
                (correct / total) * 100
            );


        document
            .getElementById(
                "scoreNumber"
            )
            .textContent =
                `${percentage}%`;

        document
            .getElementById(
                "scoreText"
            )
            .textContent =
                `${correct} out of ${total} questions correct.`;

        document
            .getElementById(
                "scoreBox"
            )
            .classList.remove(
                "hidden"
            );


        document
            .getElementById(
                "scoreBox"
            )
            .scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
    }

                (

                );

                "error"
            );

            button.disabled = false;

            button.textContent =
                "Save Exam";

            return;

        setTimeout(() => {

            button.textContent =

        }, 2000);

async function saveQuestions(examId, questionList) {
    const form = new FormData();

    form.append("exam_id", String(examId));

    const cleanQuestions = questionList.map(q => ({
        question: q.question || "",
        options: Array.isArray(q.options) ? q.options : [],
        answer: q.answer || "",
        difficulty: q.difficulty || "medium",
        question_type: q.question_type || "multiple_choice"
    }));

    form.append("questions", JSON.stringify(cleanQuestions));

    const response = await fetch(`${BACKEND_URL}/questions`, {
        method: "POST",
        body: form
    });

    const rawText = await response.text();

    let data;

    try {
        data = JSON.parse(rawText);
    } catch {
        throw new Error(
            `Server returned invalid response (${response.status}): ${rawText}`
        );
    }

    if (!response.ok) {
        let errorMessage = "";

        if (Array.isArray(data.detail)) {
            errorMessage = data.detail
                .map(item => {
                    if (typeof item === "string") return item;

                    const location = Array.isArray(item.loc)
                        ? item.loc.join(" → ")
                        : "";

                    return `${location}: ${item.msg || JSON.stringify(item)}`;
                })
                .join("\n");
        } else if (typeof data.detail === "string") {
            errorMessage = data.detail;
        } else if (data.error) {
            errorMessage =
                typeof data.error === "string"
                    ? data.error
                    : JSON.stringify(data.error);
        } else {
            errorMessage = JSON.stringify(data);
        }

        throw new Error(
            `Could not save questions (${response.status}): ${errorMessage}`
        );
    }

    if (data.success === false) {
        throw new Error(
            typeof data.error === "string"
                ? data.error
                : JSON.stringify(data)
        );
    }

    return data;
}

    const form = new FormData();

    form.append(
        "exam_id",
        String(examId)
    );

    const cleanQuestions = questionList.map(q => ({
        question: q.question || "",
        options: Array.isArray(q.options)
            ? q.options
            : [],
        answer: q.answer || "",
        difficulty: q.difficulty || "medium",
        question_type:
            q.question_type ||
            "multiple_choice"
    }));

    form.append(
        "questions",
        JSON.stringify(cleanQuestions)
    );

    let response;

    try {

            {
                method: "POST",
                body: form
            }
        );

    } catch (networkError) {

        throw new Error(
            "Network error while saving questions."
        );
    }

    const raw = await response.text();

    let data;

    try {

        data = JSON.parse(raw);

    } catch {

        throw new Error(
            `Server returned an invalid response (${response.status}): ${raw}`
        );
    }

    if (!response.ok) {

        let detail = "";

        if (Array.isArray(data.detail)) {

            detail = data.detail
                .map(item => {

                    if (typeof item === "string") {
                        return item;
                    }

                    const location =
                        Array.isArray(item.loc)
                            ? item.loc.join(" → ")
                            : "";

                    return `${location}: ${
                        item.msg ||
                        JSON.stringify(item)
                    }`;

                })
                .join("\n");

        } else if (
            typeof data.detail === "string"
        ) {

            detail = data.detail;

        } else if (data.error) {

            detail =
                typeof data.error === "string"
                    ? data.error
                    : JSON.stringify(data.error);

        } else {

            detail = JSON.stringify(data);
        }

        throw new Error(
            `Could not save questions (${response.status}): ${detail}`
        );
    }

    if (data.success === false) {

        throw new Error(
            typeof data.error === "string"
                ? data.error
                : JSON.stringify(data)
        );
    }

    console.log(
        `✓ ${questionList.length} questions saved successfully.`
    );

}

    async function saveQuestions(
        examId,
        questionList
    ) {

        for (
            let i = 0;
            i < questionList.length;
            i++
        ) {

            const q =
                questionList[i];


            const questionForm =
                new FormData();

            questionForm.append(
                "exam_id",
                String(examId)
            );

                String(

                )
            );

                )
            );

            questionForm.append(
                "answer",
                String(
                    q.answer || ""
                )
            );

            questionForm.append(
                "difficulty",
                String(
                    q.difficulty ||
                    "medium"
                )
            );

            questionForm.append(
                "question_type",
                String(
                    q.question_type ||
                    "multiple_choice"
                )
            );


            let response;

            try {

                response =
                    await fetch(
                        `${BACKEND_URL}/questions`,
                        {
                            method: "POST",
                            body: questionForm
                        }
                    );

            } catch (networkError) {

                throw new Error(
                    `Question ${i + 1}: Network error while saving question.`
                );
            }


            const raw =
                await response.text();


            if (!response.ok) {

                let detail =
                    raw;

                try {

                    const errorData =
                        JSON.parse(raw);

                    detail =
                        errorData.detail ||
                        errorData.message ||
                        raw;

                } catch {
                    // Keep raw response.
                }


                throw new Error(
                    `Question ${i + 1} could not be saved: ${detail}`
                );
            }


            console.log(
                `Question ${i + 1} saved successfully.`
            );
        }
    }

    // ============================================================

    async function loadLibrary() {

        const container =
            document.getElementById(
                "libraryContainer"
            );

        if (!container) return;

        container.innerHTML = `
            <div class="loading">
                Loading public tests...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/exams`
                );


            const raw =
                await response.text();

            let data;

            try {

                data =
                    JSON.parse(raw);

            } catch {

                throw new Error(
                    "Invalid response from server."
                );
            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    `HTTP ${response.status}`
                );
            }


            let exams =
                Array.isArray(data)
                    ? data
                    : (
                        data.exams ||
                        data.data ||
                        []
                    );


            // Only PUBLIC exams
            exams =
                exams.filter(
                    exam =>
                        exam.is_public === true ||
                        exam.is_public === "true"
                );


            if (
                exams.length === 0
            ) {

                container.innerHTML = `
                    <div class="card empty">
                        No public tests are available yet.
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            exams.forEach(
                exam => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "exam-card";


                    const badge =
                        document.createElement(
                            "span"
                        );

                    badge.className =
                        "badge public";

                    badge.textContent =
                        "PUBLIC";


                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.textContent =
                        exam.title ||
                        "Untitled Test";


                    const meta =
                        document.createElement(
                            "div"
                        );

                    meta.className =
                        "exam-meta";

                    meta.innerHTML = `
                        <div>
                            <strong>Subject:</strong>
                            ${escapeHTML(
                                exam.subject_name ||
                                "Unknown"
                            )}
                        </div>

                        <div>
                            <strong>Grade:</strong>
                            ${escapeHTML(
                                exam.grade ||
                                "Not specified"
                            )}
                        </div>

                        <div>
                            <strong>Topic:</strong>
                            ${escapeHTML(
                                exam.topic ||
                                "General"
                            )}
                        </div>

                        <div>
                            <strong>Type:</strong>
                            ${escapeHTML(
                                exam.exam_type ||
                                "Practice"
                            )}
                        </div>

                        <div>
                            <strong>Year:</strong>
                            ${escapeHTML(
                                exam.year ||
                                "Not specified"
                            )}
                        </div>
                    `;


                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "primary";

                    button.textContent =
                        "Open Test";

                    button.style.marginTop =
                        "12px";

                    button.onclick =
                        () =>
                            openSavedTest(
                                exam.id
                            );


                    card.appendChild(
                        badge
                    );

                    card.appendChild(
                        title
                    );

                    card.appendChild(
                        meta
                    );

                    card.appendChild(
                        button
                    );

                    container.appendChild(
                        card
                    );
                }
            );


        } catch (error) {

            console.error(
                "Library error:",
                error
            );

            container.innerHTML = `
                <div class="card">
                    <div class="status show error">
                        Failed to load public tests:
                        ${escapeHTML(error.message)}
                    </div>
                </div>
            `;
        }
    }


    // ============================================================
    // OPEN SAVED TEST
    // ============================================================

    async function openSavedTest(
        examId
    ) {

        try {

            const response =
                await fetch(
                    `${BACKEND_URL}/exams/${examId}`
                );


            const raw =
                await response.text();

            let data;

            try {

                data =
                    JSON.parse(raw);

            } catch {

                throw new Error(
                    "Invalid server response."
                );
            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    `HTTP ${response.status}`
                );
            }


            currentSavedExam =
                data.exam ||
                data;


            let savedQuestions =
                data.questions ||
                (
                    currentSavedExam &&
                    currentSavedExam.questions
                ) ||
                [];


            if (
                !Array.isArray(
                    savedQuestions
                )
            ) {

                savedQuestions = [];
            }


            currentSavedExam.questions =
                savedQuestions
                    .map(
                        normalizeQuestion
                    )
                    .filter(Boolean);


            const container =
                document.getElementById(
                    "savedTestContainer"
                );


            container.innerHTML = `
                <h2>
                    ${escapeHTML(
                        currentSavedExam.title ||
                        "Saved Test"
                    )}
                </h2>

                <p>
                    ${escapeHTML(
                        currentSavedExam.description ||
                        "No description."
                    )}
                </p>

                <div class="exam-meta">
                    <strong>Grade:</strong>
                    ${escapeHTML(
                        currentSavedExam.grade ||
                        "Not specified"
                    )}
                    <br>

                    <strong>Topic:</strong>
                    ${escapeHTML(
                        currentSavedExam.topic ||
                        "General"
                    )}
                </div>
            `;


            if (
                currentSavedExam.questions.length === 0
            ) {

                container.innerHTML += `
                    <div class="status show error">
                        This test does not contain any questions.
                    </div>
                `;

            } else {

                const questionsDiv =
                    document.createElement(
                        "div"
                    );

                questionsDiv.id =
                    "savedQuestionsPreview";

                questionsDiv.style.marginTop =
                    "20px";

                container.appendChild(
                    questionsDiv
                );


                renderQuestions(
                    currentSavedExam.questions,
                    "savedQuestionsPreview"
                );
            }


            showSection(
                "savedTestSection"
            );


        } catch (error) {

            console.error(
                "Open saved test error:",
                error
            );

            alert(
                `Failed to open test: ${error.message}`
            );
        }
    }


    // ============================================================
    // USE SAVED TEST
    // ============================================================

    function useCurrentSavedTest() {

        if (
            !currentSavedExam ||
            !currentSavedExam.questions ||
            currentSavedExam.questions.length === 0
        ) {

            alert(
                "This test does not contain usable questions."
            );

            return;
        }


        questions =
            currentSavedExam.questions.map(
                q => ({
                    ...q,
                    checked: false,
                    isCorrect: false
                })
            );


        currentExam = {

            title:
                currentSavedExam.title ||
                "Saved Test",

            subject_id:
                currentSavedExam.subject_id ||
                "",

            grade:
                currentSavedExam.grade ||
                "",

            topic:
                currentSavedExam.topic ||
                "",

            exam_type:
                currentSavedExam.exam_type ||
                "Practice",

            year:
                currentSavedExam.year ||
                "",

            description:
                currentSavedExam.description ||
                "",

            file_url:
                currentSavedExam.file_url ||
                "",

            answer_url:
                currentSavedExam.answer_url ||
                ""
        };


        document
            .getElementById(
                "generatedTitle"
            )
            .textContent =
                currentExam.title;


        renderQuestions(
            questions,
            "questionsContainer"
        );


        document
            .getElementById(
                "generatedSection"
            )
            .classList.remove(
                "hidden"
            );


        document
            .getElementById(
                "savePanel"
            )
            .classList.add(
                "hidden"
            );


        document
            .getElementById(
                "scoreBox"
            )
            .classList.add(
                "hidden"
            );


        showSection(
            "createSection",
            document.getElementById(
                "createTab"
            )
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // ============================================================
    // CLOSE SAVED TEST
    // ============================================================

    function closeSavedTest() {

        currentSavedExam =
            null;

        showSection(
            "librarySection",
            document.getElementById(
                "libraryTab"
            )
        );

        loadLibrary();
    }


    // ============================================================
    // HTML ESCAPE
    // ============================================================

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

</script>
