<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text2Test AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
        }

        .container {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .upload-box {
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .upload-box strong {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .upload-box span {
            color: #6b7280;
        }

        #fileInput {
            display: none;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary:hover:not(:disabled) {
            background: #d1d5db;
        }

        .success-btn {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .status {
            margin-top: 16px;
            padding: 12px 15px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            background: #fff;
        }

        .question-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .option {
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 12px 14px;
            margin: 8px 0;
            cursor: pointer;
            transition: 0.15s;
            background: white;
        }

        .option:hover {
            background: #f3f4f6;
        }

        .option.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option.correct {
            border-color: #16a34a;
            background: #dcfce7;
        }

        .option.incorrect {
            border-color: #dc2626;
            background: #fee2e2;
        }

        .answer-input {
            margin-top: 10px;
        }

        .check-answer-btn {
            margin-top: 12px;
            background: #2563eb;
            color: white;
        }

        .feedback {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .feedback.correct {
            background: #dcfce7;
            color: #166534;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        .answer {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
        }

        .question-meta {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
        }

        .exam-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .exam-card h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .exam-card p {
            margin: 7px 0;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 30px;
        }

        .result-box {
            text-align: center;
            padding: 30px;
            background: #eff6ff;
            border-radius: 12px;
        }

        .result-box h2 {
            font-size: 38px;
            margin: 0 0 10px;
            color: #1d4ed8;
        }

        .library-info {
            background: #f9fafb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .file-name {
            margin-top: 10px;
            font-weight: 600;
            color: #2563eb;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .container {
                width: 96%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Text2Test AI</h1>
    <p>Upload your textbook PDF to create an intelligent test.</p>
</header>

<div class="container">

    <!-- =====================================================
         CREATE TEST
         ===================================================== -->

    <section class="card" id="createSection">

        <h2>Create Test</h2>

        <div
            class="upload-box"
            id="uploadBox"
        >
            <strong>Choose your PDF</strong>
            <span>Click here to select a textbook PDF</span>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
            >
        </div>

        <div
            class="file-name"
            id="fileName"
        ></div>

        <div class="form-grid" style="margin-top:25px;">

            <!-- SUBJECT -->
            <div class="form-group">
                <label for="subject">
                    Subject
                </label>

                <select id="subject">
                    <option value="">
                        Loading subjects...
                    </option>
                </select>
            </div>

            <!-- GRADE -->
            <div class="form-group">
                <label for="grade">
                    Grade
                </label>

                <input
                    type="text"
                    id="grade"
                    placeholder="e.g. Grade 10"
                >
            </div>

            <!-- TOPIC -->
            <div class="form-group">
                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="e.g. Cell Biology"
                >
            </div>

            <!-- EXAM TYPE -->
            <div class="form-group">
                <label for="examType">
                    Exam Type
                </label>

                <select id="examType">
                    <option value="Practice Test">
                        Practice Test
                    </option>

                    <option value="Midterm Exam">
                        Midterm Exam
                    </option>

                    <option value="Final Exam">
                        Final Exam
                    </option>

                    <option value="Quiz">
                        Quiz
                    </option>

                    <option value="Review Test">
                        Review Test
                    </option>
                </select>
            </div>

            <!-- YEAR -->
            <div class="form-group">
                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    placeholder="e.g. 2026"
                >
            </div>

            <!-- QUESTION COUNT -->
            <div class="form-group">
                <label for="questionCount">
                    Number of Questions
                </label>

                <input
                    type="number"
                    id="questionCount"
                    min="10"
                    max="40"
                    value="20"
                >
            </div>

            <!-- DIFFICULTY -->
            <div class="form-group">
                <label for="difficulty">
                    Difficulty
                </label>

                <select id="difficulty">
                    <option value="easy">
                        Easy
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="hard">
                        Hard
                    </option>
                </select>
            </div>

            <!-- QUESTION TYPE -->
            <div class="form-group">
                <label for="questionType">
                    Question Type
                </label>

                <select id="questionType">
                    <option value="multiple_choice">
                        Multiple Choice
                    </option>

                    <option value="true_false">
                        True / False
                    </option>

                    <option value="short_answer">
                        Short Answer
                    </option>
                </select>
            </div>

            <!-- DESCRIPTION -->
            <div class="form-group full">
                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Optional description for this test..."
                ></textarea>
            </div>

        </div>

        <div class="buttons">

            <button
                class="primary"
                id="generateBtn"
            >
                Generate Test
            </button>

            <button
                class="secondary"
                id="clearBtn"
            >
                Clear
            </button>

        </div>

        <div
            class="status"
            id="status"
        ></div>

    </section>


    <!-- =====================================================
         GENERATED TEST
         ===================================================== -->

    <section
        class="card hidden"
        id="generatedSection"
    >

        <h2>Generated Test</h2>

        <div id="questionsContainer"></div>

        <div class="buttons">

            <button
                class="success-btn"
                id="saveBtn"
            >
                Save Exam
            </button>

            <button
                class="primary"
                id="finishBtn"
            >
                Finish Test
            </button>

            <button
                class="secondary"
                id="newTestBtn"
            >
                New Test
            </button>

        </div>

    </section>


    <!-- =====================================================
         SAVE EXAM
         ===================================================== -->

    <section
        class="card hidden"
        id="saveExamSection"
    >

        <h2>Save Exam</h2>

<div class="form-group">
    <label for="visibility">Exam Visibility</label>

    <select id="visibility">
        <option value="private">Private — Only me</option>
        <option value="public">Public — Everyone can use it</option>
    </select>
</div>

        <div class="form-group">

            <label for="saveTitle">
                Test Title
            </label>

            <input
                type="text"
                id="saveTitle"
                placeholder="Enter a title for this test"
            >

        </div>

        <div class="buttons">

            <button
                class="success-btn"
                id="confirmSaveBtn"
            >
                Save Exam
            </button>

            <button
                class="secondary"
                id="cancelSaveBtn"
            >
                Cancel
            </button>

        </div>

        <div
            class="status"
            id="saveStatus"
        ></div>

    </section>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <section
        class="card hidden"
        id="resultSection"
    >

        <h2>Test Result</h2>

        <div
            class="result-box"
            id="scoreBox"
        ></div>

    </section>


    <!-- =====================================================
         TEST LIBRARY
         ===================================================== -->

    <section class="card">

        <h2>Test Library</h2>

        <p>
            Browse saved tests and reuse them whenever you need.
        </p>

        <div class="buttons">

            <button
                class="secondary"
                id="refreshLibraryBtn"
            >
                Refresh Library
            </button>

        </div>

        <div
            id="libraryContainer"
            style="margin-top:20px;"
        >
            <div class="empty">
                Loading tests...
            </div>
        </div>

    </section>


    <!-- =====================================================
         OPEN SAVED TEST
         ===================================================== -->

    <section
        class="card hidden"
        id="libraryExamSection"
    >

        <h2 id="libraryExamTitle">
            Saved Test
        </h2>

        <div
            class="library-info"
            id="libraryExamInfo"
        ></div>

        <div
            id="libraryQuestionsContainer"
        ></div>

        <div class="buttons">

            <button
                class="primary"
                id="reuseBtn"
            >
                Use This Test
            </button>

            <button
                class="secondary"
                id="closeLibraryExamBtn"
            >
                Close
            </button>

        </div>

    </section>

</div>


<script>

    /* =========================================================
       BACKEND CONFIGURATION
       ========================================================= */

    const BACKEND_URL =
        "https://text2test-backend.onrender.com";

    const UPLOAD_URL =
        BACKEND_URL + "/upload-pdf";

    const SAVE_EXAM_URL =
        BACKEND_URL + "/save-exam";

    const SAVE_QUESTIONS_URL =
        BACKEND_URL + "/questions";

    const SUBJECTS_URL =
        BACKEND_URL + "/subjects";

    const EXAMS_URL =
        BACKEND_URL + "/exams";


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const fileInput =
        document.getElementById("fileInput");

    const uploadBox =
        document.getElementById("uploadBox");

    const fileName =
        document.getElementById("fileName");

    const subject =
        document.getElementById("subject");

    const grade =
        document.getElementById("grade");

    const topic =
        document.getElementById("topic");

    const examType =
        document.getElementById("examType");

    const year =
        document.getElementById("year");

    const questionCount =
        document.getElementById("questionCount");

    const difficulty =
        document.getElementById("difficulty");

    const questionType =
        document.getElementById("questionType");

    const description =
        document.getElementById("description");

    const generateBtn =
        document.getElementById("generateBtn");

    const clearBtn =
        document.getElementById("clearBtn");

    const status =
        document.getElementById("status");

    const generatedSection =
        document.getElementById("generatedSection");

    const questionsContainer =
        document.getElementById("questionsContainer");

    const saveBtn =
        document.getElementById("saveBtn");

    const finishBtn =
        document.getElementById("finishBtn");

    const newTestBtn =
        document.getElementById("newTestBtn");

    const saveExamSection =
        document.getElementById("saveExamSection");

    const saveTitle =
        document.getElementById("saveTitle");

    const confirmSaveBtn =
        document.getElementById("confirmSaveBtn");

    const cancelSaveBtn =
        document.getElementById("cancelSaveBtn");

    const saveStatus =
        document.getElementById("saveStatus");

    const resultSection =
        document.getElementById("resultSection");

    const scoreBox =
        document.getElementById("scoreBox");

    const libraryContainer =
        document.getElementById("libraryContainer");

    const refreshLibraryBtn =
        document.getElementById("refreshLibraryBtn");

    const libraryExamSection =
        document.getElementById("libraryExamSection");

    const libraryExamTitle =
        document.getElementById("libraryExamTitle");

    const libraryExamInfo =
        document.getElementById("libraryExamInfo");

    const libraryQuestionsContainer =
        document.getElementById(
            "libraryQuestionsContainer"
        );

    const reuseBtn =
        document.getElementById("reuseBtn");

    const closeLibraryExamBtn =
        document.getElementById(
            "closeLibraryExamBtn"
        );


    /* =========================================================
       STATE
       ========================================================= */

    let selectedFile = null;

    let questions = [];

    let currentLibraryExam = null;

    let currentLibraryQuestions = [];


    /* =========================================================
       FILE UPLOAD
       ========================================================= */

    uploadBox.addEventListener(
        "click",
        function() {
            fileInput.click();
        }
    );


    fileInput.addEventListener(
        "change",
        function() {

            if (!fileInput.files.length) {
                selectedFile = null;
                fileName.textContent = "";
                return;
            }

            selectedFile =
                fileInput.files[0];

            fileName.textContent =
                "Selected file: " +
                selectedFile.name;

        }
    );


    /* =========================================================
       STATUS
       ========================================================= */

    function showStatus(
        message,
        type = "info"
    ) {

        status.textContent =
            message;

        status.className =
            "status show " + type;
    }


    function showSaveStatus(
        message,
        type = "info"
    ) {

        saveStatus.textContent =
            message;

        saveStatus.className =
            "status show " + type;
    }


    /* =========================================================
       ESCAPE HTML
       ========================================================= */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }


    /* =========================================================
       LOAD SUBJECTS FROM SUPABASE
       ========================================================= */

    async function loadSubjects() {

        subject.innerHTML =
            `<option value="">
                Loading subjects...
            </option>`;

        try {

            const response =
                await fetch(
                    SUBJECTS_URL
                );

            const rawText =
                await response.text();

            console.log(
                "SUBJECTS RESPONSE:",
                rawText
            );

            let data;

            try {

                data =
                    JSON.parse(
                        rawText
                    );

            } catch (error) {

                throw new Error(
                    "Invalid response from /subjects."
                );
            }

            const subjects =
                Array.isArray(data)
                    ? data
                    : data.subjects || [];

            subject.innerHTML =
                `<option value="">
                    Select a subject
                </option>`;

            if (!subjects.length) {

                subject.innerHTML =
                    `<option value="">
                        No subjects found
                    </option>`;

                return;
            }

            subjects.forEach(
                function(item) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        item.id;

                    option.textContent =
                        item.Name ||
                        item.name ||
                        item.subject_name ||
                        "Unknown Subject";

                    subject.appendChild(
                        option
                    );
                }
            );

        } catch (error) {

            console.error(
                "SUBJECT LOAD ERROR:",
                error
            );

            subject.innerHTML =
                `<option value="">
                    Could not load subjects
                </option>`;
        }
    }


    /* =========================================================
       PARSE AI QUESTIONS
       ========================================================= */

    function parseAIQuestions(text) {

        if (!text || !text.trim()) {
            return [];
        }

        const cleaned =
            text
                .replace(
                    /```json/gi,
                    ""
                )
                .replace(
                    /```/g,
                    ""
                )
                .trim();


        /* -----------------------------------------------------
           TRY JSON FIRST
           ----------------------------------------------------- */

        try {

            const parsed =
                JSON.parse(cleaned);

            if (Array.isArray(parsed)) {

                return parsed.map(
                    normalizeQuestion
                );
            }

            if (
                parsed.questions &&
                Array.isArray(
                    parsed.questions
                )
            ) {

                return parsed.questions.map(
                    normalizeQuestion
                );
            }

        } catch (error) {
            console.log(
                "Response is not JSON. Trying text parser."
            );
        }


        /* -----------------------------------------------------
           TEXT PARSER
           ----------------------------------------------------- */

        const lines =
            cleaned
                .split("\n")
                .map(
                    line =>
                        line.trim()
                )
                .filter(Boolean);


        const result = [];

        let current = null;


        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            const line =
                lines[i];


            const questionMatch =
                line.match(
                    /^(?:Question\s*)?(\d+)[\.\):\-]\s*(.+)$/i
                );


            if (questionMatch) {

                if (current) {
                    result.push(
                        normalizeQuestion(
                            current
                        )
                    );
                }

                current = {

                    question:
                        questionMatch[2],

                    options: {},

                    answer: "",

                    difficulty:
                        difficulty.value,

                    question_type:
                        questionType.value,

                    topic:
                        topic.value || "General"
                };

                continue;
            }


            if (!current) {
                continue;
            }


            const optionMatch =
                line.match(
                    /^([A-D])[\.\):]\s*(.+)$/i
                );


            if (optionMatch) {

                current.options[
                    optionMatch[1].toUpperCase()
                ] =
                    optionMatch[2];

                continue;
            }


            const answerMatch =
                line.match(
                    /^(?:Correct\s+Answer|Answer)\s*:\s*(.+)$/i
                );


            if (answerMatch) {

                current.answer =
                    answerMatch[1].trim();

                continue;
            }


            if (
                current.question &&
                !current.answer &&
                !Object.keys(
                    current.options
                ).length
            ) {

                current.question +=
                    " " + line;
            }
        }


        if (current) {

            result.push(
                normalizeQuestion(
                    current
                )
            );
        }


        return result;
    }


    /* =========================================================
       NORMALIZE QUESTION
       ========================================================= */

    function normalizeQuestion(q) {

        let options =
            q.options || {};


        if (
            typeof options ===
            "string"
        ) {

            try {

                options =
                    JSON.parse(
                        options
                    );

            } catch (error) {

                options = {};
            }
        }


        return {

            question:
                String(
                    q.question || ""
                ).trim(),

            options:
                options || {},

            answer:
                String(
                    q.answer || ""
                ).trim(),

            difficulty:
                q.difficulty ||
                difficulty.value ||
                "medium",

            question_type:
                q.question_type ||
                questionType.value ||
                "multiple_choice",

            topic:
                q.topic ||
                topic.value ||
                "General",

            userAnswer: null,

            checked: false,

            isCorrect: null
        };
    }


    /* =========================================================
       GENERATE TEST
       ========================================================= */

    generateBtn.addEventListener(
        "click",
        async function() {

            if (!selectedFile) {

                showStatus(
                    "Please select a PDF file first.",
                    "error"
                );

                return;
            }


            let count =
                parseInt(
                    questionCount.value,
                    10
                );


            if (
                isNaN(count) ||
                count < 10 ||
                count > 40
            ) {

                showStatus(
                    "Question count must be between 10 and 40.",
                    "error"
                );

                return;
            }


            generateBtn.disabled =
                true;

            generateBtn.textContent =
                "Generating...";


            showStatus(
                "Uploading PDF and generating your test. Please wait...",
                "info"
            );


            const formData =
                new FormData();

            formData.append(
                "pdf",
                selectedFile
            );

            formData.append(
                "question_count",
                String(count)
            );

            formData.append(
                "difficulty",
                difficulty.value
            );

            formData.append(
                "question_type",
                questionType.value
            );


            try {

                const response =
                    await fetch(
                        UPLOAD_URL,
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const rawText =
                    await response.text();

                    "UPLOAD RAW RESPONSE:",
                    rawText
                );

                try {

                    data =
                        JSON.parse(
                            rawText
                        );

                } catch (error) {

                    throw new Error(
                        "Invalid JSON returned by the backend."
                    );
                }

                    !response.ok ||
                    data.success === false
                ) {

                    throw new Error(
                        data.error ||
                        data.message ||
                        data.detail ||
                        "Could not generate the test."
                    );
                }


                const generatedText =
                    data.test ||
                    data.generated_text ||
                    data.questions ||
                    "";


                questions =
                    parseAIQuestions(
                        String(
                            generatedText
                        )
                    );


                if (!questions.length) {

                    console.error(
                        "AI TEXT:",
                        generatedText
                    );

                    throw new Error(
                        "Could not read the questions from the AI response."
                    );
                }


                questions =
                    questions.slice(
                        0,
                        count
                    );

                    "hidden"
                );

    /* =========================================================
       RENDER QUESTIONS
       ========================================================= */

    function renderQuestions() {

        questionsContainer.innerHTML =
            "";


        if (!questions.length) {

            questionsContainer.innerHTML =
                `<div class="empty">
                    No questions available.
                </div>`;

            return;
        }


        questions.forEach(
            function(q, index) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "question-card";


                const questionTitle =
                    document.createElement(
                        "div"
                    );

                questionTitle.className =
                    "question-title";

                questionTitle.innerHTML =
                    `${index + 1}. ${
                        escapeHtml(
                            q.question
                        )
                    }`;

                card.appendChild(
                    questionTitle
                );


                const type =
                    String(
                        q.question_type ||
                        ""
                    ).toLowerCase();


                /* -------------------------------------------------
                   SHORT ANSWER
                   ------------------------------------------------- */

                if (
                    type ===
                    "short_answer"
                ) {

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "text";

                    input.className =
                        "answer-input";

                    input.placeholder =
                        "Type your answer here...";

                    input.dataset.question =
                        index;

                    input.addEventListener(
                        "input",
                        function() {

                            if (
                                !q.checked
                            ) {

                                q.userAnswer =
                                    input.value;
                            }
                        }
                    );

                    card.appendChild(
                        input
                    );

                }

                /* -------------------------------------------------
                   TRUE / FALSE
                   ------------------------------------------------- */

                else if (
                    type ===
                    "true_false"
                ) {

                    const tfOptions = [
                        "True",
                        "False"
                    ];


                    tfOptions.forEach(
                        function(value) {

                            const option =
                                createInteractiveOption(
                                    index,
                                    value,
                                    value
                                );

                            card.appendChild(
                                option
                            );
                        }
                    );

                }

                /* -------------------------------------------------
                   MULTIPLE CHOICE
                   ------------------------------------------------- */

                else {

                    Object.entries(
                        q.options || {}
                    ).forEach(
                        function([
                            key,
                            value
                        ]) {

                            const option =
                                createInteractiveOption(
                                    index,
                                    key,
                                    value
                                );

                            card.appendChild(
                                option
                            );
                        }
                    );
                }


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "question-meta";

                meta.textContent =
                    "Type: " +
                    (
                        q.question_type ||
                        "unknown"
                    ) +
                    " | Difficulty: " +
                    (
                        q.difficulty ||
                        "unknown"
                    );

                card.appendChild(
                    meta
                );


                const checkButton =
                    document.createElement(
                        "button"
                    );

                checkButton.className =
                    "check-answer-btn";

                checkButton.textContent =
                    "Check Answer";

                checkButton.addEventListener(
                    "click",
                    function() {

                        checkQuestion(
                            index,
                            card
                        );
                    }
                );

                card.appendChild(
                    checkButton
                );


                const feedback =
                    document.createElement(
                        "div"
                    );

                feedback.className =
                    "feedback hidden";

                feedback.dataset.feedback =
                    index;

                card.appendChild(
                    feedback
                );


                const answer =
                    document.createElement(
                        "div"
                    );

                answer.className =
                    "answer hidden";

                answer.dataset.correctAnswer =
                    index;

                answer.innerHTML =
                    "<strong>Correct Answer:</strong> " +
                    escapeHtml(
                        q.answer ||
                        "Not provided"
                    );

                card.appendChild(
                    answer
                );


                questionsContainer.appendChild(
                    card
                );
            }
        );
    }


    /* =========================================================
       CREATE INTERACTIVE OPTION
       ========================================================= */

    function createInteractiveOption(
        questionIndex,
        key,
        value
    ) {

        const option =
            document.createElement(
                "div"
            );

        option.className =
            "option";

        option.dataset.key =
            key;

        option.dataset.question =
            questionIndex;

        option.innerHTML =
            `<strong>${escapeHtml(
                key
            )}.</strong> ${
                escapeHtml(
                    String(value)
                )
            }`;


        option.addEventListener(
            "click",
            function() {

                const q =
                    questions[
                        questionIndex
                    ];


                if (
                    q.checked
                ) {
                    return;
                }


                document
                    .querySelectorAll(
                        `.option[data-question="${questionIndex}"]`
                    )
                    .forEach(
                        function(item) {

                            item.classList.remove(
                                "selected"
                            );
                        }
                    );


                option.classList.add(
                    "selected"
                );


                q.userAnswer =
                    String(
                        key
                    );
            }
        );


        return option;
    }


    /* =========================================================
       CHECK ONE QUESTION
       ========================================================= */

    function checkQuestion(
        index,
        card
    ) {

        const q =
            questions[index];


        let userAnswer =
            q.userAnswer;


        const type =
            String(
                q.question_type ||
                ""
            ).toLowerCase();


        /* -----------------------------------------------------
           SHORT ANSWER
           ----------------------------------------------------- */

        if (
            type ===
            "short_answer"
        ) {

            const input =
                card.querySelector(
                    ".answer-input"
                );

            if (
                !input ||
                !input.value.trim()
            ) {

                alert(
                    "Please enter an answer first."
                );

                return;
            }

            userAnswer =
                input.value.trim();

            q.userAnswer =
                userAnswer;
        }


        /* -----------------------------------------------------
           MCQ / TRUE FALSE
           ----------------------------------------------------- */

        else {

            if (
                userAnswer ===
                null ||
                userAnswer ===
                undefined ||
                userAnswer === ""
            ) {

                alert(
                    "Please select an answer first."
                );

                return;
            }
        }


        const correctAnswer =
            String(
                q.answer || ""
            ).trim();


        let isCorrect =
            false;


        /* -----------------------------------------------------
           ACCEPT MULTIPLE ANSWER FORMATS
           ----------------------------------------------------- */

        const normalizedUser =
            String(
                userAnswer
            )
            .trim()
            .toLowerCase();


        const normalizedCorrect =
            correctAnswer
                .trim()
                .toLowerCase();


        if (
            normalizedUser ===
            normalizedCorrect
        ) {

            isCorrect =
                true;

        } else {

            /*
             * If the answer is something like:
             * A. Mitochondria
             *
             * and the user selected:
             * A
             *
             * accept it.
             */

            if (
                normalizedCorrect.startsWith(
                    normalizedUser + "."
                )
            ) {

                isCorrect =
                    true;
            }


            /*
             * If the answer is:
             * A) Mitochondria
             */

            if (
                normalizedCorrect.startsWith(
                    normalizedUser + ")"
                )
            ) {

                isCorrect =
                    true;
            }


            /*
             * If answer contains:
             * A - Mitochondria
             */

            if (
                normalizedCorrect.startsWith(
                    normalizedUser + " -"
                )
            ) {

                isCorrect =
                    true;
            }
        }


        q.checked =
            true;

        q.isCorrect =
            isCorrect;


        /* -----------------------------------------------------
           MARK OPTIONS
           ----------------------------------------------------- */

        card
            .querySelectorAll(
                ".option"
            )
            .forEach(
                function(option) {

                    const key =
                        String(
                            option.dataset.key ||
                            ""
                        )
                        .trim()
                        .toLowerCase();


                    const selected =
                        key ===
                        normalizedUser;


                    const correct =
                        key ===
                        normalizedCorrect;


                    if (selected) {

                        option.classList.add(
                            isCorrect
                                ? "correct"
                                : "incorrect"
                        );
                    }


                    if (
                        correct &&
                        !isCorrect
                    ) {

                        option.classList.add(
                            "correct"
                        );
                    }
                }
            );


        /* -----------------------------------------------------
           FEEDBACK
           ----------------------------------------------------- */

        const feedback =
            card.querySelector(
                ".feedback"
            );


        feedback.classList.remove(
            "hidden",
            "correct",
            "incorrect"
        );


        if (isCorrect) {

            feedback.classList.add(
                "correct"
            );

            feedback.textContent =
                "Correct!";

        } else {

            feedback.classList.add(
                "incorrect"
            );

            feedback.textContent =
                "Incorrect.";
        }


        /* -----------------------------------------------------
           SHOW CORRECT ANSWER
           ----------------------------------------------------- */

        const answer =
            card.querySelector(
                ".answer"
            );

        answer.classList.remove(
            "hidden"
        );


        /* -----------------------------------------------------
           DISABLE CHECK BUTTON
           ----------------------------------------------------- */

        const button =
            card.querySelector(
                ".check-answer-btn"
            );

        button.disabled =
            true;

        button.textContent =
            "Answer Checked";
    }

                behavior: "smooth"
            });


        } catch (error) {

            console.error(
                "OPEN EXAM ERROR:",
                error
            );


            libraryExamTitle.textContent =
                "Could not load test";


            libraryQuestionsContainer.innerHTML =
                `
                <div class="empty">

                    ${escapeHtml(
                        error.message
                    )}

                </div>
                `;
        }
    }


    /* =========================================================
       RENDER SAVED QUESTIONS
       ========================================================= */

    function renderLibraryQuestions() {

        libraryQuestionsContainer.innerHTML =
            "";


        if (
            !currentLibraryQuestions.length
        ) {

            libraryQuestionsContainer.innerHTML =
                `
                <div class="empty">
                    No questions found for this test.
                </div>
                `;

            return;
        }


        currentLibraryQuestions.forEach(
            function(q, index) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "question-card";


                let options =
                    q.options ||
                    {};


                if (
                    typeof options ===
                    "string"
                ) {

                    try {

                        options =
                            JSON.parse(
                                options
                            );

                    } catch (error) {

                        options = {};
                    }
                }


                card.innerHTML = `

                    <div class="question-title">

                        ${index + 1}.
                        ${escapeHtml(
                            q.question ||
                            ""
                        )}

                    </div>

                `;


                const type =
                    String(
                        q.question_type ||
                        ""
                    ).toLowerCase();


                if (
                    type ===
                    "short_answer"
                ) {

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "text";

                    input.className =
                        "answer-input";

                    input.placeholder =
                        "Type your answer here...";

                    input.dataset.libraryQuestion =
                        index;

                    card.appendChild(
                        input
                    );

                } else {

                    Object.entries(
                        options
                    ).forEach(
                        function([
                            key,
                            value
                        ]) {

                            const option =
                                document.createElement(
                                    "div"
                                );

                            option.className =
                                "option";

                            option.dataset.key =
                                key;

                            option.innerHTML =
                                `<strong>${
                                    escapeHtml(
                                        key
                                    )
                                }.</strong> ${
                                    escapeHtml(
                                        String(
                                            value
                                        )
                                    )
                                }`;


                            option.addEventListener(
                                "click",
                                function() {

                                    card
                                        .querySelectorAll(
                                            ".option"
                                        )
                                        .forEach(
                                            function(
                                                item
                                            ) {

                                                item.classList.remove(
                                                    "selected"
                                                );
                                            }
                                        );


                                    option.classList.add(
                                        "selected"
                                    );
                                }
                            );


                            card.appendChild(
                                option
                            );
                        }
                    );
                }


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "question-meta";

                meta.textContent =
                    "Type: " +
                    (
                        q.question_type ||
                        "unknown"
                    ) +
                    " | Difficulty: " +
                    (
                        q.difficulty ||
                        "unknown"
                    );


                card.appendChild(
                    meta
                );


                const checkButton =
                    document.createElement(
                        "button"
                    );

                checkButton.className =
                    "check-answer-btn";

                checkButton.textContent =
                    "Check Answer";


                checkButton.addEventListener(
                    "click",
                    function() {

                        checkLibraryQuestion(
                            q,
                            card
                        );
                    }
                );


                card.appendChild(
                    checkButton
                );


                const feedback =
                    document.createElement(
                        "div"
                    );

                feedback.className =
                    "feedback hidden";


                card.appendChild(
                    feedback
                );


                const answer =
                    document.createElement(
                        "div"
                    );

                answer.className =
                    "answer hidden";

                answer.innerHTML =
                    "<strong>Correct Answer:</strong> " +
                    escapeHtml(
                        String(
                            q.answer ||
                            ""
                        )
                    );


                card.appendChild(
                    answer
                );


                libraryQuestionsContainer.appendChild(
                    card
                );
            }
        );
    }


    /* =========================================================
       CHECK SAVED QUESTION
       ========================================================= */

    function checkLibraryQuestion(
        q,
        card
    ) {

        const type =
            String(
                q.question_type ||
                ""
            ).toLowerCase();


        let userAnswer =
            "";


        if (
            type ===
            "short_answer"
        ) {

            const input =
                card.querySelector(
                    ".answer-input"
                );


            if (
                !input ||
                !input.value.trim()
            ) {

                alert(
                    "Please enter an answer first."
                );

                return;
            }


            userAnswer =
                input.value.trim();

        } else {

            const selected =
                card.querySelector(
                    ".option.selected"
                );


            if (!selected) {

                alert(
                    "Please select an answer first."
                );

                return;
            }


            userAnswer =
                selected.dataset.key;
        }


        const correctAnswer =
            String(
                q.answer ||
                ""
            )
            .trim()
            .toLowerCase();


        const normalizedUser =
            userAnswer
                .trim()
                .toLowerCase();


        let isCorrect =
            normalizedUser ===
            correctAnswer;


        if (
            correctAnswer.startsWith(
                normalizedUser + "."
            ) ||
            correctAnswer.startsWith(
                normalizedUser + ")"
            ) ||
            correctAnswer.startsWith(
                normalizedUser + " -"
            )
        ) {

            isCorrect =
                true;
        }


        card
            .querySelectorAll(
                ".option"
            )
            .forEach(
                function(option) {

                    const key =
                        String(
                            option.dataset.key ||
                            ""
                        )
                        .trim()
                        .toLowerCase();


                    if (
                        key ===
                        normalizedUser
                    ) {

                        option.classList.add(
                            isCorrect
                                ? "correct"
                                : "incorrect"
                        );
                    }


                    if (
                        key ===
                        correctAnswer &&
                        !isCorrect
                    ) {

                        option.classList.add(
                            "correct"
                        );
                    }
                }
            );


        const feedback =
            card.querySelector(
                ".feedback"
            );


        feedback.classList.remove(
            "hidden",
            "correct",
            "incorrect"
        );


        if (isCorrect) {

            feedback.classList.add(
                "correct"
            );

            feedback.textContent =
                "Correct!";

        } else {

            feedback.classList.add(
                "incorrect"
            );

            feedback.textContent =
                "Incorrect.";
        }


        card
            .querySelector(
                ".answer"
            )
            .classList.remove(
                "hidden"
            );


        const button =
            card.querySelector(
                ".check-answer-btn"
            );


        button.disabled =
            true;

        button.textContent =
            "Answer Checked";
    }


    /* =========================================================
       REUSE SAVED TEST
       ========================================================= */

    reuseBtn.addEventListener(
        "click",
        function() {

            if (
                !currentLibraryQuestions.length
            ) {

                return;
            }


            questions =
                currentLibraryQuestions.map(
                    function(q) {

                        let options =
                            q.options ||
                            {};


                        if (
                            typeof options ===
                            "string"
                        ) {

                            try {

                                options =
                                    JSON.parse(
                                        options
                                    );

                            } catch (error) {

                                options = {};
                            }
                        }


                        return {

                            question:
                                q.question,

                            options:
                                options,

                            answer:
                                q.answer || "",

                            difficulty:
                                q.difficulty ||
                                "medium",

                            question_type:
                                q.question_type ||
                                "multiple_choice",

                            topic:
                                q.topic ||
                                currentLibraryExam?.topic ||
                                "General",

                            userAnswer:
                                null,

                            checked:
                                false,

                            isCorrect:
                                null
                        };
                    }
                );


            renderQuestions();


            generatedSection.classList.remove(
                "hidden"
            );


            resultSection.classList.add(
                "hidden"
            );


            saveExamSection.classList.add(
                "hidden"
            );


            libraryExamSection.classList.add(
                "hidden"
            );


            generatedSection.scrollIntoView({
                behavior: "smooth"
            });


            showStatus(
                "Saved test loaded successfully. You can use it as a new test.",
                "success"
            );
        }
    );


    /* =========================================================
       CLOSE LIBRARY EXAM
       ========================================================= */

    closeLibraryExamBtn.addEventListener(
        "click",
        function() {

            libraryExamSection.classList.add(
                "hidden"
            );
        }
    );


    /* =========================================================
       REFRESH LIBRARY
       ========================================================= */

    refreshLibraryBtn.addEventListener(
        "click",
        async function() {

            refreshLibraryBtn.disabled =
                true;

            refreshLibraryBtn.textContent =
                "Loading...";


            try {

                await loadLibrary();

            } finally {

                refreshLibraryBtn.disabled =
                    false;

                refreshLibraryBtn.textContent =
                    "Refresh Library";
            }
        }
    );


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    async function initialize() {

        console.log(
            "Text2Test AI frontend loaded successfully."
        );


        await loadSubjects();


        await loadLibrary();
    }


    initialize();

</script>

</body>
